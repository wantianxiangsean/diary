  .foot{text-align:center;color:#a9a9a9;font-size:14.5px;margin-top:34px}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);

  /* ================= 打印 ================= */

    body{font-size:14px}
    .topbar,.addbtn,.cellbtn,.toolrow,.toast,.copynote,
    .tbl-bar,.tbl-overlay,.tbl-tools,.colorbar{display:none !important}
    .page{box-shadow:none;margin:0;width:auto;padding:0;max-width:none}
    .banner,.item,.sec,table.doc tr,.goal{break-inside:avoid}
    .ed{background:transparent !important;box-shadow:none !important}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

  /* ============================================================
     基础工具
     ============================================================ */
  function todayISO(d){
    const t = d || new Date();
    return new Date(t.getTime() - t.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }
  function shiftDate(iso, delta){
    const p = iso.split("-").map(Number);
    const dt = new Date(p[0], p[1]-1, p[2]);
    dt.setDate(dt.getDate() + delta);
    return todayISO(dt);
  }
  function cnDate(iso){
    const p = iso.split("-").map(Number);
    const dt = new Date(p[0], p[1]-1, p[2]);
    const wk = "日一二三四五六".charAt(dt.getDay());
    return p[0] + "年" + p[1] + "月" + p[2] + "日 星期" + wk;
  }
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const str = (v) => typeof v === "string" ? v : "";
  const oneLine = (s) => String(s||"").replace(/\s*\n\s*/g,"；").trim();
  const cellMd = (s) => oneLine(s).replace(/\|/g,"\\|");

  /* 富文本 ↔ 纯文本 */
  function htmlToText(html){
    return String(html == null ? "" : html)
      .replace(/<br\s*\/?>/gi, "\n")
      .replace(/<\/(div|p|li|tr)>/gi, "\n")
      .replace(/<[^>]*>/g, "")
      .replace(/&nbsp;/g, " ")
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/&amp;/g, "&");
  }
  function rgbToHex(c){
    const m = /^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(String(c||""));
    if (m) return "#" + [m[1],m[2],m[3]]
      .map(function(n){ return ("0" + Number(n).toString(16)).slice(-2); }).join("").toUpperCase();
    if (/^#[0-9a-fA-F]{6}$/.test(String(c||""))) return String(c).toUpperCase();
    return "";
  }
  /* 只保留文字、<br> 和 <span style="color:#RRGGBB"> */
  function cleanHtml(html){
    const src = document.createElement("div");
    src.innerHTML = String(html == null ? "" : html);
    const out = document.createElement("div");
    function walk(from, to){
      Array.prototype.slice.call(from.childNodes).forEach(function(n){
        if (n.nodeType === 3){ to.appendChild(document.createTextNode(n.nodeValue)); return; }
        if (n.nodeType !== 1) return;
        const tag = n.tagName.toLowerCase();
        if (tag === "br"){ to.appendChild(document.createElement("br")); return; }
        if (tag === "span"){
          const hex = rgbToHex(n.style && n.style.color);
          if (hex){
            const sp = document.createElement("span");
            sp.setAttribute("style", "color:" + hex);
            walk(n, sp);
            to.appendChild(sp);
          }else{
            walk(n, to);
          }
          return;
        }
        if (tag === "div" || tag === "p"){
          if (to.childNodes.length) to.appendChild(document.createElement("br"));
          walk(n, to);
          return;
        }
        walk(n, to);
      });
    }
    walk(src, out);
    return out.innerHTML;
  }

  /* ============================================================
     网格工具：cell = { t, v(HTML), rs?, cs? }，被覆盖位置为 null
     ============================================================ */
  const CELL_TYPES = ["head","sub","cat","body","check"];

  function spanSize(cell){
    return { rs: Math.max(1, cell.rs || 1), cs: Math.max(1, cell.cs || 1) };
  }
  function makeCell(t, v, extra){
    return Object.assign({ t:t || "body", v:v || "", rs:1, cs:1 }, extra || {});
  }
  function normalizeCols(cols){
    const list = (Array.isArray(cols) ? cols : []).map(function(w){ return Math.max(5, Number(w) || 10); });
    if (!list.length) return [25,25,25,25];
    const sum = list.reduce(function(a,b){ return a+b; }, 0);
    if (!sum) return list.map(function(){ return 100/list.length; });
    return list.map(function(w){ return (w/sum)*100; });
  }
  function canonical(cells, C){
    const R = cells.length;
    const out = Array.from({length:R}, function(){ return new Array(C).fill(null); });
    const used = Array.from({length:R}, function(){ return new Array(C).fill(false); });
    for (let r=0;r<R;r++){
      for (let c=0;c<C;c++){
        const cell = cells[r] && cells[r][c];
        if (!cell || used[r][c]) continue;
        const sz = spanSize(cell);
        const r2 = Math.min(R, r + sz.rs), c2 = Math.min(C, c + sz.cs);
        out[r][c] = Object.assign({}, cell, { rs: r2-r, cs: c2-c });
        for (let i=r;i<r2;i++) for (let j=c;j<c2;j++) used[i][j] = true;
      }
    }
    return out;
  }
  function coverage(cells, C){
    const R = cells.length;
    const cov = Array.from({length:R}, function(){ return new Array(C).fill(false); });
    for (let r=0;r<R;r++){
      for (let c=0;c<C;c++){
        const cell = cells[r][c];
        if (!cell) continue;
        const sz = spanSize(cell);
        for (let i=r;i<Math.min(R, r+sz.rs);i++)
          for (let j=c;j<Math.min(C, c+sz.cs);j++) cov[i][j] = true;
      }
    }
    return cov;
  }
  function anchorAt(g, r, c){
    for (let i=r;i>=0;i--){
      for (let j=c;j>=0;j--){
        const cell = g.cells[i] && g.cells[i][j];
        if (!cell) continue;
        const sz = spanSize(cell);
        if (i<=r && r<i+sz.rs && j<=c && c<j+sz.cs) return { r:i, c:j, cell:cell };
      }
    }
    return null;
  }
  function expandRect(g, r1, c1, r2, c2){
    let changed = true, guard = 0;
    while (changed && guard++ < 500){
      changed = false;
      for (let r=r1;r<=r2;r++){
        for (let c=c1;c<=c2;c++){
          const a = anchorAt(g, r, c);
          if (!a) continue;
          const sz = spanSize(a.cell);
          const ar2 = a.r + sz.rs - 1, ac2 = a.c + sz.cs - 1;
          if (a.r < r1){ r1 = a.r; changed = true; }
          if (a.c < c1){ c1 = a.c; changed = true; }
          if (ar2 > r2){ r2 = ar2; changed = true; }
          if (ac2 > c2){ c2 = ac2; changed = true; }
        }
      }
    }
    return { r1:r1, c1:c1, r2:r2, c2:c2 };
  }
  function anchorsIn(g, rect){
    const out = [];
    for (let r=rect.r1;r<=rect.r2;r++){
      for (let c=rect.c1;c<=rect.c2;c++){
        const cell = g.cells[r] && g.cells[r][c];
        if (cell) out.push({ r:r, c:c, cell:cell });
      }
    }
    return out;
  }
  function makeGrid(cols, cells){
    const body = canonical(cells, cols.length);
    return { cols: normalizeCols(cols), rows: body.map(function(){ return null; }), cells: body };
  }

  function monthlyGridFromGroups(groups){
    const C = 4;
    const cells = [[ makeCell("head","类别",{cs:2}), null, makeCell("head","目标内容"), makeCell("head","方法和措施") ]];
    (groups || []).forEach(function(grp){
      const rows = (grp && grp.rows) || [];
      if (!rows.length) return;
      rows.forEach(function(row, i){
        const line = new Array(C).fill(null);
        if (i === 0) line[0] = makeCell("cat", esc(str(grp.cat)), { rs: rows.length });
        line[1] = makeCell("body", esc(str(row.sub)));
        line[2] = makeCell("body", esc(str(row.content)));
        line[3] = makeCell("body", esc(str(row.method)));
        cells.push(line);
      });
    });
    if (cells.length === 1){
      cells.push([ makeCell("cat","",{rs:2}), makeCell("body",""), makeCell("body",""), makeCell("body","") ]);
      cells.push([ null, makeCell("body",""), makeCell("body",""), makeCell("body","") ]);
    }
    return makeGrid([15,15,40,30], cells);
  }

  function weeklyGridFrom(priority, otherTitle, other){
    const C = 2;
    const cells = [ [ makeCell("head","优先顺序"), makeCell("head","本周工作目标") ] ];
    (priority || []).forEach(function(r){
      cells.push([ makeCell("body", esc(str(r.code))), makeCell("body", esc(str(r.target))) ]);
    });
    const others = other || [];
    if (others.length){
      cells.push([ makeCell("sub", esc(str(otherTitle) || "本周其他目标"), { cs:C }), null ]);
      others.forEach(function(r){
        cells.push([ makeCell("cat", esc(str(r.cat))), makeCell("body", esc(str(r.items))) ]);
      });
    }
    return makeGrid([22,78], cells);
  }

  function sanitizeGrid(raw, h){
    if (!raw || !Array.isArray(raw.cols) || !Array.isArray(raw.cells) || !raw.cells.length) return null;
    const C = raw.cols.length;
    if (C < 1 || C > 12) return null;
    const cells = [];
    for (let r=0;r<raw.cells.length && r<400;r++){
      const row = raw.cells[r];
      if (!Array.isArray(row)) continue;
      const line = new Array(C).fill(null);
      for (let c=0;c<C;c++){
        const src = row[c];
        if (!src) continue;
        const t = CELL_TYPES.indexOf(src.t) >= 0 ? src.t : "body";
        line[c] = makeCell(t, h(src.v), {
          rs: Math.max(1, Math.min(60, Number(src.rs) || 1)),
          cs: Math.max(1, Math.min(12, Number(src.cs) || 1))
        });
      }
      cells.push(line);
    }
    if (!cells.length) return null;
    const body = canonical(cells, C);
    return {
      cols: normalizeCols(raw.cols),
      rows: body.map(function(_, i){
        const v = Array.isArray(raw.rows) ? raw.rows[i] : null;
        return (typeof v === "number" && v > 0) ? Math.min(800, v) : null;
      }),
      cells: body
    };
  }

  function templateState(){
    const s = emptyState();
    s.__blank = false;
    s.motto = esc(TEMPLATE.motto);
    s.dayWhat = cnDate(currentDate);
    s.sunrise = esc(TEMPLATE.sunrise); s.sunset = esc(TEMPLATE.sunset);
    s.wake = esc(TEMPLATE.wake); s.sleep = esc(TEMPLATE.sleep);
    s.morning = TEMPLATE.morning.map(esc);
    s.morningDone = TEMPLATE.morningDone.slice();
    s.annualTitle = esc(TEMPLATE.annualTitle);
    s.work = TEMPLATE.work.map(function(r){ return { title:esc(r[0]), content:esc(r[1]) }; });
    s.life = TEMPLATE.life.map(function(r){ return { title:esc(r[0]), content:esc(r[1]) }; });
    s.monthlyTitle = esc(TEMPLATE.monthlyTitle);
    s.weeklyTitle = esc(TEMPLATE.weeklyTitle);
    s.tables = {
      monthly: monthlyGridFromGroups(TEMPLATE.monthlyGroups),
      weekly: weeklyGridFrom(TEMPLATE.weeklyPriority, TEMPLATE.weeklyOtherTitle, TEMPLATE.weeklyOther)
    };
    s.B = esc(TEMPLATE.B); s.C = esc(TEMPLATE.C);
    s.D = TEMPLATE.D.map(function(r){ return { title:esc(r.title), p:esc(r.p), m:esc(r.m), s:esc(r.s) }; });
    s.E = esc(TEMPLATE.E); s.F = esc(TEMPLATE.F); s.G = esc(TEMPLATE.G);
    s.H = { steps:esc(TEMPLATE.H.steps), exercise:esc(TEMPLATE.H.exercise), diet:esc(TEMPLATE.H.diet) };
    s.habits = HABITS.map(function(name){

  function normalize(raw){
    const s = emptyState();
    if (!raw || typeof raw !== "object") return s;

    /* v3 起字段值即 HTML；更早的版本按纯文本转义 */
    const isV3 = (Number(raw.__v) || 0) >= DATA_VERSION;
    const h = function(v){ return isV3 ? str(v) : esc(str(v)); };

    ["motto","dayWhat","sunrise","sunset","wake","sleep","annualTitle",
     "annualWorkLabel","annualLifeLabel","monthlyTitle","weeklyTitle",
     "B","C","E","F","G"].forEach(function(k){ s[k] = h(raw[k]) || s[k]; });

    if (Array.isArray(raw.morning))
      MORNING_QUESTIONS.forEach(function(_,i){ s.morning[i] = h(raw.morning[i]); });
    if (Array.isArray(raw.morningDone))
      MORNING_QUESTIONS.forEach(function(_,i){ s.morningDone[i] = !!raw.morningDone[i]; });

    ["work","life"].forEach(function(g){
      if (Array.isArray(raw[g]))
        s[g] = raw[g].map(function(r){ return { title:h(r&&r.title), content:h(r&&r.content) }; });
    });

    const mt = sanitizeGrid(raw.tables && raw.tables.monthly, h);
    const wt = sanitizeGrid(raw.tables && raw.tables.weekly, h);
    if (mt) s.tables.monthly = mt;
    else if (Array.isArray(raw.monthly)) s.tables.monthly = monthlyGridFromGroups(raw.monthly);

    if (wt) s.tables.weekly = wt;
    else if (Array.isArray(raw.weeklyPriority) || Array.isArray(raw.weeklyOther)){
      s.tables.weekly = weeklyGridFrom(raw.weeklyPriority, raw.weeklyOtherTitle, raw.weeklyOther);
    }

    if (Array.isArray(raw.D))
      s.D = raw.D.map(function(r){ return { title:h(r&&r.title), p:h(r&&r.p), m:h(r&&r.m), s:h(r&&r.s) }; });
    if (raw.H && typeof raw.H === "object")
      ["steps","exercise","diet"].forEach(function(k){ s.H[k] = h(raw.H[k]); });
    if (Array.isArray(raw.habits))
      s.habits = HABITS.map(function(_,i){
        const x = raw.habits[i] || {};
        return { checked: !!x.checked, note: h(x.note) };
      });

    /* 旧版整段颜色 → 包一层带颜色的 span */
    if (raw.colors && typeof raw.colors === "object"){
      Object.keys(raw.colors).forEach(function(path){
        const c = raw.colors[path];
        if (!rgbToHex(c)) return;
        const parts = path.split(".");
        let o = s;
        for (let i=0;i<parts.length-1;i++){
          o = o[parts[i]];
          if (!o) return;
        }
        const leaf = parts[parts.length-1];
        if (typeof o[leaf] !== "string") return;
        const html = o[leaf];
        if (!html) return;
        o[leaf] = '<span style="color:' + rgbToHex(c) + '">' + html + '</span>';
      });
    }

    s.__blank = false;
    return s;
  }

  /* 只比较用户真正写下的文字，模板自带文字（表头、空表格等）不算内容 */
  function sameValue(a, b){
    if (a === b) return true;
    if (a == null || b == null) return a == null && b == null;
    if (typeof a !== typeof b) return false;
    if (typeof a !== "object") return typeof a === "string" ? a.trim() === b.trim() : a === b;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    if (Array.isArray(a)){
      if (a.length !== b.length) return false;
      for (let i=0;i<a.length;i++) if (!sameValue(a[i], b[i])) return false;
      return true;
    }
    const keys = Object.keys(b);
    for (let i=0;i<keys.length;i++){
      if (!sameValue(a[keys[i]], b[keys[i]])) return false;
    }
    return true;
  }

  /* 两张表是否都还停在模板原样（只看文字与勾选，列宽行高不算内容） */
  function sameGrid(a, b){
    if (!a || !b) return a === b;
    if (!Array.isArray(a.cols) || !Array.isArray(b.cols)) return false;
    if (a.cols.length !== b.cols.length) return false;
    const rowsA = a.cells || [], rowsB = b.cells || [];
    if (rowsA.length !== rowsB.length) return false;
    for (let r=0;r<rowsB.length;r++){
      const lineA = rowsA[r] || [], lineB = rowsB[r] || [];
      if (lineA.length !== lineB.length) return false;
      for (let c=0;c<lineB.length;c++){
        const ca = lineA[c], cb = lineB[c];
        if (!ca || !cb) { if (!!ca !== !!cb) return false; continue; }
        if ((ca.t || "") !== (cb.t || "")) return false;
        if (!!ca.checked !== !!cb.checked) return false;
        if (htmlToText(ca.v || "").trim() !== htmlToText(cb.v || "").trim()) return false;
      }
    }
    return true;
  }

  /* 这一篇是否等于空白模板：等于就说明还没写过东西 */
  function isBlankRecord(s){
    if (!s) return true;
    const b = emptyState();
    const skip = ["__v","__blank","dayWhat"];
    const keys = Object.keys(b);
    for (let i=0;i<keys.length;i++){
      const k = keys[i];
      if (skip.indexOf(k) >= 0) continue;
      if (k === "tables"){
        if (!sameGrid(s.tables && s.tables.monthly, b.tables.monthly)) return false;
        if (!sameGrid(s.tables && s.tables.weekly, b.tables.weekly)) return false;
        continue;
      }
      if (k === "morningDone" || k === "habits"){
        // 打卡勾选与习惯备注不单独算成"写过内容"
        const srcA = s[k] || [], srcB = b[k] || [];
        for (let j=0;j<srcB.length;j++){
          const a = srcA[j] || {}, bb = srcB[j] || {};
          if (htmlToText(a.note || "").trim() !== htmlToText(bb.note || "").trim()) return false;
        }
        continue;
      }
      if (!sameValue(s[k], b[k])) return false;
    }
    return true;
  }

  /* ============================================================

  function findPrevRecord(date){
    for (let i=1;i<=COPY_LOOKBACK_DAYS;i++){
      const d = shiftDate(date, -i);
      try{
        const raw = localStorage.getItem(LS_PREFIX + d);
        if (!raw) continue;
        const s = normalize(JSON.parse(raw));
        if (isBlankRecord(s)) continue;   // 只认真正写过内容的那一天，空白记录直接跳过
        return { date:d, state:s };
      }catch(e){}
    }
    return null;
  }

  function inheritState(src, date){
    const s = JSON.parse(JSON.stringify(src));
    s.__v = DATA_VERSION;
    s.dayWhat = cnDate(date);
    s.morningDone = MORNING_QUESTIONS.map(function(){ return false; });
    s.habits = HABITS.map(function(_, i){
      const h0 = (s.habits && s.habits[i]) || {};
      return { checked:false, note: h0.note || "" };
    });

    return s;
  }

  function load(date){

  function save(){

  function setPath(path, val){

  /* ============================================================

  function ed(path, html, ph, opts){

      ' data-path="' + path + '"' +

  /* ============================================================
     表格编辑模式
     ============================================================ */
  function applyEditMode(){
    appEl.querySelectorAll(".tblwrap").forEach(function(wrap){
      const key = wrap.dataset.table;
      const on = !!editingTables[key];
      wrap.classList.toggle("editing", on);
      const btn = wrap.querySelector(".tbl-toggle");
      btn.classList.toggle("on", on);
      btn.textContent = on ? "完成编辑" : "表格编辑";
      const hint = wrap.querySelector(".tbl-hint");
      if (hint) hint.hidden = !on;
      if (on){
        wrap.querySelectorAll(".ed").forEach(function(el){ el.setAttribute("contenteditable","false"); });
        buildHandles(wrap, key);
      }else{
        wrap.querySelector(".tbl-overlay").innerHTML = "";
      }
    });
    updateToolbar();
  }

  /* 选择模式：关掉所有编辑能力，整页变成可框选的文本 */
  function applySelectMode(){
    appEl.classList.add("select-mode");
    appEl.querySelectorAll(".addbtn,.cellbtn,.tbl-bar,.tbl-tools,.tbl-overlay,.copynote").forEach(function(el){
      el.style.display = "none";
    });
    appEl.querySelectorAll(".ed").forEach(function(el){ el.setAttribute("contenteditable","false"); });
  }

  function buildHandles(wrap, key){
    const table = wrap.querySelector("table.doc");
    const ov = wrap.querySelector(".tbl-overlay");
    if (!table || !ov) return;
    ov.innerHTML = "";

    const wr = wrap.getBoundingClientRect();
    const tr = table.getBoundingClientRect();
    ov.style.left = (tr.left - wr.left) + "px";
    ov.style.top = (tr.top - wr.top) + "px";
    ov.style.width = tr.width + "px";
    ov.style.height = tr.height + "px";

    const g = state.tables[key];

    let acc = 0;
    g.cols.forEach(function(w, i){
      acc += w;
      if (i >= g.cols.length - 1) return;
      const h = document.createElement("div");
      h.className = "chandle";
      h.dataset.col = String(i);
      h.style.left = ((acc / 100) * tr.width) + "px";
      ov.appendChild(h);
      wireColHandle(h, i, key, wrap, table);
    });

    const trs = Array.prototype.slice.call(table.querySelectorAll("tr"));
    trs.forEach(function(rowEl, i){
      if (i >= trs.length - 1) return;
      const rr = rowEl.getBoundingClientRect();
      const h = document.createElement("div");
      h.className = "rhandle";
      h.dataset.row = String(i);
      h.style.top = (rr.bottom - tr.top) + "px";
      ov.appendChild(h);
      wireRowHandle(h, i, rowEl, key, wrap);
    });
  }

  function wireColHandle(h, i, key, wrap, table){
    h.addEventListener("pointerdown", function(e){
      e.preventDefault(); e.stopPropagation();
      const g = state.tables[key];
      const j = (i + 1 < g.cols.length) ? i + 1 : i - 1;
      if (j < 0) return;
      const tableW = table.getBoundingClientRect().width || 1;
      const startX = e.clientX;
      const a0 = g.cols[i], b0 = g.cols[j];
      const MIN = 5;
      const colEls = table.querySelectorAll("col");
      const onMove = function(ev){
        const d = ((ev.clientX - startX) / tableW) * 100;
        let a = a0 + d, b = b0 - d;
        if (a < MIN){ b -= (MIN - a); a = MIN; }
        if (b < MIN){ a -= (MIN - b); b = MIN; }
        g.cols[i] = a; g.cols[j] = b;
        if (colEls[i]) colEls[i].style.width = a + "%";
        if (colEls[j]) colEls[j].style.width = b + "%";
        buildHandles(wrap, key);
      };
      const onUp = function(){
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        scheduleSave();
        buildHandles(wrap, key);
        positionToolbar();
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    });
  }

  function wireRowHandle(h, i, rowEl, key, wrap){
    h.addEventListener("pointerdown", function(e){
      e.preventDefault(); e.stopPropagation();
      const g = state.tables[key];
      const startY = e.clientY;
      const h0 = rowEl.getBoundingClientRect().height;
      const onMove = function(ev){
        const val = Math.round(Math.max(24, Math.min(400, h0 + (ev.clientY - startY))));
        rowEl.style.height = val + "px";
        g.rows[i] = val;
        buildHandles(wrap, key);
      };
      const onUp = function(){
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        scheduleSave();
        buildHandles(wrap, key);
        positionToolbar();
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    });
    h.addEventListener("dblclick", function(e){
      e.preventDefault(); e.stopPropagation();
      state.tables[key].rows[i] = null;
      scheduleSave();
      render();
    });
  }

  function paintSel(){
    appEl.querySelectorAll("td.sel").forEach(function(td){ td.classList.remove("sel"); });
    if (!sel) return;
    const wrap = appEl.querySelector('.tblwrap[data-table="' + sel.key + '"]');
    if (!wrap) return;
    wrap.querySelectorAll("td").forEach(function(td){
      const r = Number(td.dataset.r), c = Number(td.dataset.c);
      if (r >= sel.r1 && r <= sel.r2 && c >= sel.c1 && c <= sel.c2) td.classList.add("sel");
    });
  }

  function updateToolbar(){
    appEl.querySelectorAll(".tblwrap").forEach(function(wrap){
      const key = wrap.dataset.table;
      const tools = wrap.querySelector(".tbl-tools");
      if (!tools) return;
      const show = editingTables[key] && sel && sel.key === key;
      tools.hidden = !show;
      if (!show) return;
      const g = state.tables[key];
      const list = anchorsIn(g, sel);
      const canSplit = list.some(function(x){ return (x.cell.rs||1) > 1 || (x.cell.cs||1) > 1; });
      tools.querySelector('[data-act="merge"]').disabled = list.length < 2;
      tools.querySelector('[data-act="split"]').disabled = !canSplit;
      tools.querySelector('[data-act="row-delete"]').disabled = g.cells.length <= 1;
    });
    positionToolbar();
  }

  function positionToolbar(){
    if (!sel) return;
    const wrap = appEl.querySelector('.tblwrap[data-table="' + sel.key + '"]');
    if (!wrap) return;
    const tools = wrap.querySelector(".tbl-tools");
    if (!tools || tools.hidden) return;
    const tds = wrap.querySelectorAll("td.sel");
    if (!tds.length) return;
    const wr = wrap.getBoundingClientRect();
    let left = Infinity, top = Infinity, bottom = -Infinity;
    tds.forEach(function(td){
      const r = td.getBoundingClientRect();
      if (r.left < left) left = r.left;
      if (r.top < top) top = r.top;
      if (r.bottom > bottom) bottom = r.bottom;
    });
    const th = tools.offsetHeight || 32;
    let y = top - wr.top - th - 6;
    if (y < 0) y = bottom - wr.top + 6;
    let x = left - wr.left;
    x = Math.max(0, Math.min(x, Math.max(0, wr.width - tools.offsetWidth)));
    tools.style.left = x + "px";
    tools.style.top = y + "px";
  }

  /* ---------- 网格结构操作 ---------- */
  function commit(fn){
    fn();
    state.tables.monthly.cols = normalizeCols(state.tables.monthly.cols);
    state.tables.weekly.cols = normalizeCols(state.tables.weekly.cols);
    scheduleSave();
    render();
  }

  function doMerge(){
    if (!sel) return;
    const key = sel.key, rect = sel;
    commit(function(){
      const g = state.tables[key];
      const list = anchorsIn(g, rect);
      if (list.length < 2) return;
      const parts = list.map(function(x){ return x.cell.v; })
        .filter(function(v){ return htmlToText(v).trim(); });
      const topCell = g.cells[rect.r1][rect.c1] || list[0].cell;
      for (let r=rect.r1;r<=rect.r2;r++)
        for (let c=rect.c1;c<=rect.c2;c++) g.cells[r][c] = null;
      g.cells[rect.r1][rect.c1] = makeCell(topCell.t, cleanHtml(parts.join("<br>")), {
        rs: rect.r2 - rect.r1 + 1,
        cs: rect.c2 - rect.c1 + 1
      });
      g.cells = canonical(g.cells, g.cols.length);
      g.rows = g.cells.map(function(_, i){ return g.rows[i] || null; });
      sel = null;
    });
    toast("已合并");
  }

  function doSplit(){
    if (!sel) return;
    const key = sel.key, rect = sel;
    commit(function(){
      const g = state.tables[key];
      const list = anchorsIn(g, rect).filter(function(x){ return (x.cell.rs||1) > 1 || (x.cell.cs||1) > 1; });
      if (!list.length) return;
      list.forEach(function(x){
        const rs = x.cell.rs || 1, cs = x.cell.cs || 1;
        const t = x.cell.t;
        x.cell.rs = 1; x.cell.cs = 1;
        for (let i=x.r;i<x.r+rs;i++){
          for (let j=x.c;j<x.c+cs;j++){
            if (i === x.r && j === x.c) continue;
            g.cells[i][j] = makeCell(t, "");
          }
        }
      });
      g.cells = canonical(g.cells, g.cols.length);
      sel = null;
    });
    toast("已拆分");
  }

  function doClear(){
    if (!sel) return;
    const key = sel.key, rect = sel;
    commit(function(){
      const g = state.tables[key];
      anchorsIn(g, rect).forEach(function(x){ x.cell.v = ""; });
    });
    toast("已清除内容");
  }

  /* 插入行：插在选区下方（选区的合并格会跟着延长） */
  function doInsertRow(){
    if (!sel) return;
    const key = sel.key, rect = sel;
    const at = rect.r2 + 1;
    commit(function(){
      const g = state.tables[key];
      const C = g.cols.length;
      for (let r=0;r<Math.min(at, g.cells.length);r++){
        for (let c=0;c<C;c++){
          const cell = g.cells[r][c];
          if (!cell) continue;
          const rs = cell.rs || 1;
          if (r + rs > at) cell.rs = rs + 1;
        }
      }
      g.cells.splice(at, 0, new Array(C).fill(null));
      g.rows.splice(at, 0, null);
      const cov = coverage(g.cells, C);
      for (let c=0;c<C;c++){
        if (!cov[at][c]) g.cells[at][c] = makeCell("body", "");
      }
      g.cells = canonical(g.cells, C);
      g.rows = g.cells.map(function(_, i){ return g.rows[i] || null; });
      sel = null;
    });
    toast("已插入一行");
  }

  /* 删除行：删掉选区覆盖的行（被切到的合并格会缩短） */
  function doDeleteRow(){
    if (!sel) return;
    const key = sel.key;
    const from = sel.r1, to = sel.r2;
    commit(function(){
      const g = state.tables[key];
      const C = g.cols.length;
      const count = to - from + 1;
      if (g.cells.length - count < 1) return;
      for (let r=0;r<g.cells.length;r++){
        for (let c=0;c<C;c++){
          const cell = g.cells[r][c];
          if (!cell) continue;
          const rs = cell.rs || 1;
          const overlap = Math.max(0, Math.min(r + rs - 1, to) - Math.max(r, from) + 1);
          if (overlap > 0) cell.rs = Math.max(1, rs - overlap);
        }
      }
      g.cells.splice(from, count);
      g.rows.splice(from, count);
      const cov = coverage(g.cells, C);
      for (let r=0;r<g.cells.length;r++){
        for (let c=0;c<C;c++){
          if (!g.cells[r][c] && !cov[r][c]) g.cells[r][c] = makeCell("body","");
        }
      }
      g.cells = canonical(g.cells, C);
      g.rows = g.cells.map(function(_, i){ return g.rows[i] || null; });
      sel = null;
    });
    toast("已删除选中行");
  }

  /* ============================================================

  function editorOf(node){

        return el.getAttribute("contenteditable") === "true" ? el : null;
      }
      el = el.parentNode;
    }
    return null;
  }

    document.addEventListener("selectionchange", onSelectionChange);
  }

  function onSelectionChange(){
    if (selectMode){ hideColorBar(); return; }
    const s = window.getSelection();
    if (!s || s.rangeCount === 0 || s.isCollapsed){ hideColorBar(); return; }
    const a = editorOf(s.anchorNode), f = editorOf(s.focusNode);
    if (!a || a !== f){ hideColorBar(); return; }
    showColorBar(a, s.getRangeAt(0));
  }

  function showColorBar(el, range){
    if (!colorBar) return;
    const r = range.getBoundingClientRect();
    if (!r || (!r.width && !r.height)) { hideColorBar(); return; }
    colorBar.hidden = false;
    const w = colorBar.offsetWidth, h = colorBar.offsetHeight;
    let top = r.top - h - 8;
    if (top < 8) top = Math.min(window.innerHeight - h - 8, r.bottom + 8);
    const left = Math.min(Math.max(8, r.left), Math.max(8, window.innerWidth - w - 8));
    colorBar.style.top = Math.max(8, top) + "px";
    colorBar.style.left = left + "px";
  }
  function hideColorBar(){ if (colorBar) colorBar.hidden = true; }

  function applyColorToSelection(color){
    const s = window.getSelection();
    if (!s || s.rangeCount === 0 || s.isCollapsed) return;
    const el = editorOf(s.anchorNode);
    if (!el || el !== editorOf(s.focusNode)) return;
    try{
      if (color){
        document.execCommand("styleWithCSS", false, true);
        document.execCommand("foreColor", false, color);
      }else{
        document.execCommand("styleWithCSS", false, true);
        document.execCommand("removeFormat", false, null);
      }
    }catch(e){ return; }
    const path = el.dataset.path;
    if (path){
      setPath(path, cleanHtml(el.innerHTML));
      scheduleSave();
    }
    toast(color ? "已给选中文字上色" : "已去掉选中文字的颜色");
  }

  /* ============================================================
     事件绑定
     ============================================================ */
  /* ---------- 上一步 / 下一步（整篇回退，防误操作） ---------- */
  let past = [], future = [], present = "";

  function snapshotNow(){
    const now = JSON.stringify(state);
    if (now === present) return;
    if (present) past.push(present);
    if (past.length > 80) past.shift();
    present = now;
    future = [];
    refreshUndoButtons();
  }
  function resetHistory(){
    past = []; future = [];
    present = JSON.stringify(state);
    refreshUndoButtons();
  }
  function restoreState(json){
    try{ state = JSON.parse(json); }catch(e){ return; }
    save();
    render();
    setStatus("已保存","saved");
    refreshUndoButtons();
  }
  function doUndo(){
    snapshotNow();
    if (!past.length){ toast("没有可回退的步骤了"); return; }
    future.push(present);
    present = past.pop();
    restoreState(present);
    toast("已回到上一步");
  }
  function doRedo(){
    if (!future.length){ toast("没有可恢复的步骤了"); return; }
    past.push(present);
    present = future.pop();
    restoreState(present);
    toast("已恢复下一步");
  }
  function refreshUndoButtons(){
    const u = document.getElementById("undoBtn"), r = document.getElementById("redoBtn");
    if (u) u.disabled = past.length === 0;
    if (r) r.disabled = future.length === 0;
  }

  function bind(){
    appEl.querySelectorAll(".ed").forEach(function(el){
      const path = el.dataset.path;
      const sync = function(){ setPath(path, cleanHtml(el.innerHTML)); scheduleSave(); };
      el.addEventListener("input", sync);
      el.addEventListener("blur", sync);
      el.addEventListener("keydown", function(e){
        if (e.key === "Enter" && el.dataset.single === "1") e.preventDefault();
      });
      el.addEventListener("paste", function(e){
        e.preventDefault();
        const t = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
        document.execCommand("insertText", false, t);
      });
      el.addEventListener("drop", function(e){ e.preventDefault(); });
    });

    appEl.querySelectorAll("[data-check]").forEach(function(el){
      const path = el.dataset.check;
      el.addEventListener("change", function(){ setPath(path, el.checked); scheduleSave(); });
    });

    appEl.querySelectorAll("[data-add]").forEach(function(btn){
      btn.addEventListener("click", function(){
        const t = btn.dataset.add;
        snapshotNow();
        if (t === "work" || t === "life") state[t].push({ title:"", content:"" });
        else if (t === "D") state.D.push({ title:"", p:"", m:"", s:"" });
        else if (t === "monthly.row"){
          const g = state.tables.monthly;
          g.cells.push(g.cols.map(function(){ return makeCell("body",""); }));
          g.rows.push(null);
        }
        else if (t === "monthly.group"){
          const g = state.tables.monthly;
          const row = g.cols.map(function(){ return makeCell("body",""); });
          row[0] = makeCell("cat","");
          g.cells.push(row);
          g.rows.push(null);
        }
        else if (t === "weekly.pri"){
          const g = state.tables.weekly;
          let at = g.cells.length;
          for (let i=0;i<g.cells.length;i++){
            if (g.cells[i].some(function(c){ return c && c.t === "sub"; })){ at = i; break; }
          }
          g.cells.splice(at, 0, g.cols.map(function(){ return makeCell("body",""); }));
          g.rows.splice(at, 0, null);
        }
        else if (t === "weekly.other"){
          const g = state.tables.weekly;
          if (!g.cells.some(function(row){ return row.some(function(c){ return c && c.t === "sub"; }); })){
            g.cells.push([ makeCell("sub","本周其他目标",{cs:2}), null ]);
            g.rows.push(null);
          }
          g.cells.push([ makeCell("cat",""), makeCell("body","") ]);
          g.rows.push(null);
        }
        scheduleSave();
        render();
      });
    });

    appEl.querySelectorAll("[data-remove]").forEach(function(btn){
      btn.addEventListener("click", function(){
        const p = btn.dataset.remove.split(".");
        const arr = state[p[0]];
        const i = Number(p[1]);
        snapshotNow();
        if (Array.isArray(arr) && arr.length > 1) arr.splice(i, 1);
        scheduleSave();
        render();
      });
    });

    /* 继承提示条 */
    appEl.querySelectorAll("[data-act]").forEach(function(btn){
      btn.addEventListener("click", function(){
        const a = btn.dataset.act;
        if (a === "copy-dismiss"){ copyNotice = null; render(); return; }
        if (a === "copy-blank"){
          snapshotNow();
          copyNotice = null;
          state = emptyState();
          state.dayWhat = cnDate(currentDate);
          save(); setStatus("已保存","saved");
          render();
          toast("已改用空白");
        }
      });
    });
    appEl.querySelectorAll("[data-tbl-toggle]").forEach(function(btn){
      btn.addEventListener("click", function(){
        const key = btn.dataset.tblToggle;
        editingTables[key] = !editingTables[key];
        sel = null;
        render();
      });
    });

    appEl.querySelectorAll(".tbl-tools button").forEach(function(btn){
      btn.addEventListener("click", function(){
        const a = btn.dataset.act;
        snapshotNow();
        if (a === "merge") doMerge();
        else if (a === "split") doSplit();
        else if (a === "clear") doClear();
        else if (a === "row-insert") doInsertRow();
        else if (a === "row-delete") doDeleteRow();
      });
    });

    appEl.querySelectorAll(".tblwrap").forEach(function(wrap){
      const key = wrap.dataset.table;
      wrap.addEventListener("pointerdown", function(e){
        if (!editingTables[key]) return;
        if (e.target.closest(".chandle,.rhandle,.tbl-tools,.tbl-toggle")) return;
        const td = e.target.closest("td");
        if (!td) return;
        e.preventDefault();
        const g = state.tables[key];
        dragging = { key:key, r0:Number(td.dataset.r), c0:Number(td.dataset.c) };
        const rect = expandRect(g, dragging.r0, dragging.c0, dragging.r0, dragging.c0);
        sel = { key:key, r1:rect.r1, c1:rect.c1, r2:rect.r2, c2:rect.c2 };
        paintSel();
        updateToolbar();

        const onMove = function(ev){
          if (!dragging) return;
          const el = document.elementFromPoint(ev.clientX, ev.clientY);
          const t2 = el && el.closest ? el.closest("td") : null;
          if (!t2 || !wrap.contains(t2)) return;
          const rr = Number(t2.dataset.r), cc = Number(t2.dataset.c);
          const raw = {
            r1: Math.min(dragging.r0, rr), c1: Math.min(dragging.c0, cc),
            r2: Math.max(dragging.r0, rr), c2: Math.max(dragging.c0, cc)
          };
          const ex = expandRect(g, raw.r1, raw.c1, raw.r2, raw.c2);
          sel = { key:key, r1:ex.r1, c1:ex.c1, r2:ex.r2, c2:ex.c2 };
          paintSel();
          updateToolbar();
        };
        const onUp = function(){
          dragging = null;
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          window.removeEventListener("pointercancel", onUp);
          updateToolbar();
        };
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      });
    });
  }

  /* ============================================================
     Markdown 导出
     ============================================================ */
  function gridMarkdown(key, L){
    const g = state.tables[key];
    if (!g || !g.cells.length) return;
    const rows = g.cells.map(function(row){
      return row.map(function(cell){
        if (!cell) return "";
        return htmlToText(cell.v);
      }).map(cellMd);
    });
    const C = g.cols.length;
    const head = rows[0] || [];
    while (head.length < C) head.push("");
    L.push("| " + head.join(" | ") + " |");
    L.push("| " + head.map(function(){ return "---"; }).join(" | ") + " |");
    rows.slice(1).forEach(function(r){
      while (r.length < C) r.push("");
      L.push("| " + r.join(" | ") + " |");
    });
  }

  function toMarkdown(){
    const L = [];
    const t = function(v){ return htmlToText(v); };
    L.push("# " + (t(state.dayWhat) || cnDate(currentDate)));
    L.push("");
    if (t(state.motto)) L.push("**" + t(state.motto) + "**");
    L.push("");
    L.push("**今天是什么日子：**");
    if (t(state.sunrise)) L.push("- 日出：" + t(state.sunrise));
    if (t(state.sunset)) L.push("- 日落：" + t(state.sunset));
    if (t(state.wake)) L.push("- 起床：" + t(state.wake));
    if (t(state.sleep)) L.push("- 就寝：" + t(state.sleep));

    L.push("", "**清晨自问：**", "");
    MORNING_QUESTIONS.forEach(function(q,i){
      const a = t(state.morning[i]).trim();
      L.push("- " + (state.morningDone[i] ? "[x] " : "[ ] ") + q + (a ? "　" + oneLine(a) : ""));
    });

    L.push("", "## A、叫我起床的不是闹钟是梦想（年目标·月目标·周目标）", "");
    if (t(state.annualTitle)) L.push("**" + t(state.annualTitle) + "**", "");
    L.push("**工作**", "");
    state.work.forEach(function(r){ if (t(r.title) || t(r.content)) L.push("- " + t(r.title) + "：" + oneLine(t(r.content))); });
    L.push("", "**生活**", "");
    state.life.forEach(function(r){ if (t(r.title) || t(r.content)) L.push("- " + t(r.title) + "：" + oneLine(t(r.content))); });

    if (t(state.monthlyTitle)) L.push("", "### " + t(state.monthlyTitle));
    L.push("");
    gridMarkdown("monthly", L);

    if (t(state.weeklyTitle)) L.push("", "### " + t(state.weeklyTitle));
    L.push("");
    gridMarkdown("weekly", L);

    sec(L, "B、今日高能要事记录", t(state.B));
    sec(L, "C、今日高能要事完成情况分析", t(state.C));

    L.push("", "## D、成功&反思日志-记录三五件有收获或希望提高的事项", "");
    state.D.filter(function(r){ return t(r.title) || t(r.p) || t(r.m) || t(r.s); }).forEach(function(r,i){
      L.push("**事项" + (i+1) + "：** " + t(r.title));
      if (t(r.p)) L.push("+ " + oneLine(t(r.p)));
      if (t(r.m)) L.push("- " + oneLine(t(r.m)));
      if (t(r.s)) L.push("★ " + oneLine(t(r.s)));
      L.push("");
    });

    sec(L, "E、财务检视", t(state.E));
    sec(L, "F、人际的投入", t(state.F));
    sec(L, "G、开卷有益（学习/读书/听书）", t(state.G));

    L.push("", "## H、健康与饮食", "");
    L.push("- 今日步数：" + t(state.H.steps));
    L.push("- 今日锻炼：" + t(state.H.exercise));
    L.push("- 今日饮食：" + t(state.H.diet));

    L.push("", "## I、好习惯检视", "");
    state.habits.forEach(function(x,i){
      const note = t(x.note);
      L.push("- " + (x.checked ? "[x] " : "[ ] ") + HABITS[i] + (note ? "　－ " + note : ""));
    });
    return L.join("\n") + "\n";
  }
  function sec(L, title, val){
    L.push("", "## " + title);
    if (val && val.trim()) L.push("", val.trim());
  }

  /* ============================================================
     交互
     ============================================================ */
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1700);
  }
  function refreshChrome(){
    document.getElementById("datePick").value = currentDate;
    document.title = currentDate + " 日记";
  }
  function goto(date){
    save();
    currentDate = date;
    state = load(date);
    sel = null; dragging = null;
    editingTables = { monthly:false, weekly:false };
    refreshChrome();
    render();
    resetHistory();
    setStatus(state.__blank ? "" : "已保存", state.__blank ? "" : "saved");
  }
  function downloadMd(){
    const md = toMarkdown();
    const blob = new Blob([md], {type:"text/markdown;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentDate + "-日记.md";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    toast("已导出 " + a.download);
  }

  function init(){
    statusEl = document.getElementById("status");
    appEl = document.getElementById("app");
    try{ document.execCommand("defaultParagraphSeparator", false, "br"); }catch(e){}

    const hasAny = (function(){
      try{
        for (let i=0;i<localStorage.length;i++){
          if (String(localStorage.key(i)).indexOf(LS_PREFIX) === 0) return true;
        }
      }catch(e){}
      return false;
    })();

    state = load(currentDate);
    if (!hasAny && state.__blank){ state = templateState(); save(); }

    initColorBar();
    refreshChrome();
    render();
    resetHistory();
    setStatus(state.__blank ? "" : "已保存", state.__blank ? "" : "saved");

    document.getElementById("datePick").addEventListener("change", function(e){ if (e.target.value) goto(e.target.value); });
    document.getElementById("prevDay").addEventListener("click", function(){ goto(shiftDate(currentDate,-1)); });
    document.getElementById("nextDay").addEventListener("click", function(){ goto(shiftDate(currentDate, 1)); });
    document.getElementById("todayBtn").addEventListener("click", function(){ goto(todayISO()); });
    document.getElementById("copyPrev").addEventListener("click", function(){
      const prev = findPrevRecord(currentDate);
      if (!prev){ toast("往前 30 天内没有填写过的记录"); return; }
      if (!isBlankRecord(state) && !confirm("用 " + cnDate(prev.date) + " 的内容覆盖当前这一篇？")) return;
      snapshotNow();
      state = inheritState(prev.state, currentDate);
      save(); setStatus("已保存","saved");
      render();
      toast("已填入 " + cnDate(prev.date) + " 的内容");
    });

    document.getElementById("fillTpl").addEventListener("click", function(){
      if (!confirm("用示例内容覆盖当前这一篇？当前内容会被替换。")) return;
      snapshotNow();
      state = templateState();
      sel = null;
      render(); save(); setStatus("已保存","saved");
      toast("已载入示例内容");
    });
    document.getElementById("clearDay").addEventListener("click", function(){
      if (!confirm("清空 " + currentDate + " 这一篇的全部内容？")) return;
      snapshotNow();
      state = emptyState();
      state.dayWhat = cnDate(currentDate);
      sel = null;
      render(); save(); setStatus("已保存","saved");
      toast("已清空本篇");
    });
    document.getElementById("exportMd").addEventListener("click", downloadMd);
    document.getElementById("selectMode").addEventListener("click", function(){
      selectMode = !selectMode;
      editingTables = { monthly:false, weekly:false };
      sel = null;
      document.getElementById("selectMode").classList.toggle("on", selectMode);
      render();
      toast(selectMode ? "选择模式：整页文字可任意框选、Ctrl+A 全选、复制（Esc 退出）" : "已退出选择模式");
    });
    document.getElementById("copyMd").addEventListener("click", async function(){
      const md = toMarkdown();
      try{
        await navigator.clipboard.writeText(md);
        toast("Markdown 已复制");
      }catch(e){
        const ta = document.createElement("textarea");
        ta.value = md;
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); toast("Markdown 已复制"); }
        catch(e2){ toast("复制失败，请手动导出"); }
        ta.remove();
      }
    });
    document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
    document.getElementById("undoBtn").addEventListener("click", doUndo);
    document.getElementById("redoBtn").addEventListener("click", doRedo);

    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && selectMode){
        selectMode = false;
        document.getElementById("selectMode").classList.remove("on");
        render();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "z"){
        e.preventDefault();
        if (e.shiftKey) doRedo(); else doUndo();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "y"){
        e.preventDefault(); doRedo(); return;
      }
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "s"){
        e.preventDefault(); save(); setStatus("已保存","saved"); toast("已保存");
      }
    });

    window.addEventListener("beforeprint", function(){
      appEl.querySelectorAll(".tbl-overlay").forEach(function(o){ o.innerHTML = ""; });
    });
    window.addEventListener("afterprint", function(){
      appEl.querySelectorAll(".tblwrap.editing").forEach(function(w){ buildHandles(w, w.dataset.table); });
      paintSel();
      updateToolbar();
    });
    window.addEventListener("beforeunload", save);

    let rzTimer = null;
    window.addEventListener("resize", function(){
      clearTimeout(rzTimer);
      rzTimer = setTimeout(function(){
        appEl.querySelectorAll(".tblwrap.editing").forEach(function(w){ buildHandles(w, w.dataset.table); });
        positionToolbar();
      }, 120);
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
