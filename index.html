<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="generator" content="diary v4">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日日记 · 1% 精进</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%231B75BB'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E6%97%A5%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --blue:#1B75BB;
    --blue-dark:#155F99;
    --orange:#F8E19B;
    --cream:#FFFFFF;
    --lblue:#E4F0F7;
    --red:#E8481F;
    --line:#6f6f6f;
    --focus:#FFF3CF;
    --hair:#ECECEC;
    --box:#E4E4E4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#f2f2f2;
    color:#111;
    font-family:"KaiTi","楷体","Kaiti SC","Kaiti TC","STKaiti","华文楷体","楷体_GB2312","DFKai-SB",serif;
    font-size:17.5px;
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }

  /* ================= 顶部工具栏（不打印） ================= */
  .topbar{
    position:sticky;top:0;z-index:60;
    display:flex;flex-wrap:wrap;align-items:center;gap:7px;
    padding:9px 14px;background:#fff;border-bottom:1px solid #dcdcdc;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
  }
  .brand{font-weight:700;color:var(--blue);margin-right:4px;white-space:nowrap}
  .topbar button{
    font:inherit;font-size:15.5px;color:#222;background:#fafafa;
    border:1px solid #cfcfcf;border-radius:6px;padding:5px 11px;cursor:pointer;
    white-space:nowrap;transition:.15s;
  }
  .topbar button:hover{background:#eef5fb;border-color:#9dc4e2}
  .topbar button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .topbar button.primary:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
  .topbar button.icon{padding:5px 10px;line-height:1.2}
  .topbar button.fontbtn{font-size:14px;font-weight:700;letter-spacing:-.03em;padding-left:9px;padding-right:9px}
  .fonttools{display:inline-flex;align-items:center;gap:3px}
  .topbar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .topbar button:disabled{opacity:.42;cursor:default}
  .topbar button:disabled:hover{background:#fafafa;border-color:#cfcfcf}
  .topbar input[type="date"]{
    font:inherit;font-size:15.5px;padding:4px 8px;border:1px solid #cfcfcf;
    border-radius:6px;background:#fff;color:#222;
  }
  .topbar input[type="week"]{
    font:inherit;font-size:15.5px;padding:4px 8px;border:1px solid #cfcfcf;
    border-radius:6px;background:#fff;color:#222;
  }
  .topbar input[type="month"]{
    font:inherit;font-size:15.5px;padding:4px 8px;border:1px solid #cfcfcf;
    border-radius:6px;background:#fff;color:#222;
  }
  .topbar [hidden]{display:none !important}
  .modetabs{display:inline-flex;align-items:center;gap:0;margin-right:3px;border:1px solid #cfcfcf;border-radius:7px;overflow:hidden;background:#f7f7f7}
  .modetabs button{
    border:0 !important;border-radius:0 !important;background:transparent !important;
    padding:5px 12px !important;color:#5d6870 !important;
  }
  .modetabs button + button{border-left:1px solid #d8d8d8 !important}
  .modetabs button.on{background:var(--blue) !important;color:#fff !important}
  .spacer{flex:1 1 auto}
  .status{font-size:14.5px;color:#8b8b8b;min-width:80px;text-align:right}
  .status.saving{color:#c98a2e}
  .status.saved{color:var(--blue)}
  .status.bad{color:#c0392b;font-weight:700}
  .more-btn{display:none}
  .more-items{display:contents}
  .topbar button.danger{color:#a8402f}
  .topbar button.danger:hover{background:#fdf1ef;border-color:#e0b3ab}

  /* ================= 云端备份面板（不打印） ================= */
  .ghpanel{
    display:none;z-index:55;background:#fbfdff;border-bottom:1px solid #cddff0;
    padding:10px 14px;font-size:15.5px;
  }
  .ghpanel.open{display:block}
  .ghrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:7px}
  .ghrow:last-child{margin-bottom:0}
  .ghrow > label{color:#5a6b7b;white-space:nowrap}
  .ghlocal-label{color:#5a6b7b;white-space:nowrap;border-left:1px solid #d7e3ee;padding-left:10px;margin-left:2px}
  .ghpanel input[type="text"],.ghpanel input[type="password"]{
    font:inherit;font-size:15px;padding:4px 8px;border:1px solid #cfcfcf;border-radius:6px;
    background:#fff;color:#222;min-width:210px;
  }
  .ghpanel button{
    font:inherit;font-size:15px;color:#222;background:#fafafa;border:1px solid #cfcfcf;
    border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap;
  }
  .ghpanel button:hover{background:#eef5fb;border-color:#9dc4e2}
  .ghchk{display:inline-flex;align-items:center;gap:5px;color:#5a6b7b;cursor:pointer}
  .ghstatus{color:#8b8b8b}
  .ghstatus.ok{color:var(--blue)}
  .ghstatus.bad{color:#c0392b}
  .ghnote{margin:6px 0 0;font-size:13.5px;color:#8b8b8b;line-height:1.55}

  /* ================= 回看面板（不打印） ================= */
  .findpanel{
    display:none;z-index:55;background:#fbfdff;border-bottom:1px solid #cddff0;
    padding:10px 14px;font-size:15.5px;
  }
  .findpanel.open{display:block}
  .frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .frow input[type="search"]{
    font:inherit;font-size:15px;padding:5px 10px;border:1px solid #cfcfcf;border-radius:6px;
    background:#fff;color:#222;flex:1 1 240px;min-width:0;
  }
  .findpanel .frow button{
    font:inherit;font-size:15px;color:#222;background:#fafafa;border:1px solid #cfcfcf;
    border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap;
  }
  .findpanel .frow button:hover{background:#eef5fb;border-color:#9dc4e2}
  .fresults{max-height:45vh;overflow-y:auto;margin-top:8px}
  .fresults:empty{display:none}
  .fgroup{font-size:13.5px;color:#8b8b8b;margin:4px 0 5px}
  .fitem{
    display:block;width:100%;text-align:left;background:#fff;border:1px solid #e3eaf0;
    border-radius:7px;padding:7px 10px;margin-bottom:6px;cursor:pointer;
    font:inherit;font-size:15px;color:#222;white-space:normal;
  }
  .fitem:hover{background:#f2f8fd;border-color:#9dc4e2}
  .fitem .ftitle{font-weight:700;color:var(--blue);font-size:15px}
  .fitem .fkind{font-size:12.5px;color:#8b8b8b;margin-left:6px;font-weight:400}
  .fitem .fsnip{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    color:#5d6870;font-size:14px;margin-top:2px;line-height:1.5;word-break:break-word;
  }
  .fitem mark{background:#FFE9A8;color:inherit;border-radius:2px}
  .fempty{color:#8b8b8b;padding:8px 2px;font-size:14.5px}
  @media (max-width:620px){
    .findpanel{padding:8px 8px}
    .fresults{max-height:60vh}
    .fitem{font-size:14.5px}
  }

  /* ================= 纸张 ================= */
  .page{
    width:min(900px,100%);
    margin:22px auto 70px;
    background:#fff;
    padding:40px clamp(16px,4.2vw,54px) 62px;
    box-shadow:0 1px 5px rgba(0,0,0,.18);
  }

  /* ================= 富文本编辑区 ================= */
  .ed{
    font:inherit;color:inherit;background:transparent;
    border:0;border-radius:4px;padding:2px 4px;
    min-height:1.65em;line-height:1.62;
    white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
    outline:none;transition:background .15s,box-shadow .15s;
  }
  .ed:focus{background:var(--focus);box-shadow:inset 0 0 0 1px #E7C97F}
  .ed:empty::before{content:attr(data-ph);color:#8c8c8c;pointer-events:none}
  table.doc .ed:empty::before{color:#9a8a63}
  table.doc td.t-head .ed:empty::before,
  table.doc td.t-sub .ed:empty::before{color:rgba(0,0,0,.45)}

  /* 复选框 */
  .cb{
    appearance:none;-webkit-appearance:none;
    width:15px;height:15px;flex:0 0 auto;margin:0;
    border:1.4px solid #4a4a4a;background:#fff;border-radius:1px;
    position:relative;cursor:pointer;vertical-align:-2px;
  }
  .cb:checked::after{
    content:"";position:absolute;left:3.4px;top:0.2px;width:4.6px;height:9.4px;
    border:2px solid #111;border-top:0;border-left:0;transform:rotate(42deg);
  }

  /* ================= 抬头 ================= */
  .motto{margin:0 0 22px}
  .motto .ed{
    text-align:center;font-weight:700;font-size:19.5px;color:var(--red);
    background:#FBFF00;border-bottom:1px dashed rgba(0,0,0,.18);
    border-radius:0;padding:4px 6px;
  }
  .motto .ed:hover{background:#F2F600}
  .motto .ed:focus{background:#F2F600;border-bottom-color:transparent}
  .lab-red{color:var(--red);font-weight:700}
  .day .daywhat{display:inline-block;width:auto;min-width:220px;color:#413E3E}
  .drows{margin-top:2px}
  .drow{display:flex;align-items:center;gap:2px;max-width:360px}
  .drow > span{flex:0 0 auto}
  .drow .ed{flex:1 1 auto}

  /* 清晨自问 */
  .morning{margin-top:18px}
  .qlist{margin-top:2px}
  .qrow{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:1px solid var(--hair)}
  .qrow .cb{margin-top:6px}
  .qrow .qtext{flex:0 0 auto;white-space:nowrap}
  .qrow .ed{flex:1 1 auto}
  @media (max-width:620px){
    .qrow{
      display:grid;grid-template-columns:18px minmax(0,1fr);
      gap:2px 7px;align-items:start;padding:7px 0;
    }
    .qrow .cb{grid-row:1;grid-column:1;margin-top:6px}
    .qrow .qtext{grid-row:1;grid-column:2;white-space:normal}
    .qrow .ed{grid-row:2;grid-column:2}
  }

  /* ================= 小节外框 ================= */
  .sec{
    border:1px solid var(--box);border-radius:4px;overflow:hidden;margin:22px 0 0;
  }
  .sec > .banner{margin:0;border-radius:0}
  .sec-body{padding:10px 14px 14px}
  .banner{
    background:var(--blue);color:#fff;font-weight:700;font-size:18.5px;
    padding:5px 12px;letter-spacing:.01em;
    margin:0;line-height:1.5;
  }
  .banner.wk-red{background:#C00000}
  .banner.wk-yellow{background:#FFC000;color:#3f2f00}
  .banner.wk-green{background:#70AD47}

  /* ================= 橙红小标题 ================= */
  .idx-red{margin:22px 0 5px}
  .idx-red .ed{
    color:#fff;font-weight:700;font-size:19px;
    border:1px solid #EB1E1E;border-radius:6px;background:#EB1E1E;
    padding:3px 10px;width:auto;min-width:250px;
  }
  .idx-red .ed:empty::before{color:rgba(255,255,255,.72)}
  .idx-red .ed:focus{color:#fff}
  .idx-black{margin:6px 0 4px}
  .idx-black .ed{
    color:var(--red);font-weight:700;font-size:17.5px;
    border:1px solid #eee;border-radius:5px;padding:2px 8px;
    width:auto;min-width:250px;background:#fff;
  }
  .idx-sub{margin:14px 0 2px;font-weight:700}

  /* ================= 年度目标条目 ================= */
  .goals{margin:1px 0 4px}
  .goal{display:flex;align-items:flex-start;gap:2px;padding:3px 0;border-bottom:1px solid var(--hair)}
  .goal .bul{flex:0 0 auto;width:16px;text-align:center}
  .goal .g-title{flex:0 0 132px}
  .goal .g-sep{flex:0 0 auto}
  .goal .g-content{flex:1 1 auto}
  .goal .cellbtn{position:static;flex:0 0 auto;opacity:0}
  .goal:hover .cellbtn{opacity:1}
  .goal-lines{display:grid;gap:2px}
  .goal-line{display:flex;align-items:flex-start;gap:6px}
  .goal-line .cb{margin-top:6px}
  .goal-line .ed{flex:1 1 auto;min-width:0}
  .goal-line.done .ed{
    text-decoration:line-through;text-decoration-thickness:1px;
    color:#8a8a8a;
  }
  .goal-line.done .ed:empty{text-decoration:none;color:#b9b9b9}
  .toolrow{margin:4px 0 4px}

  /* ================= 表格 ================= */
  .tblwrap{position:relative;margin:5px 0 4px}
  .tbl-bar{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-height:24px}
  .tbl-hint{font-size:14px;color:#9aa7b1;margin-right:auto}
  .tbl-toggle{
    font:inherit;font-size:14.5px;color:#66727c;background:#fff;
    border:1px solid #dbe2e8;border-radius:6px;padding:2px 9px;cursor:pointer;
  }
  .tbl-toggle:hover{border-color:var(--blue);color:var(--blue)}
  .tbl-toggle.on{background:var(--blue);border-color:var(--blue);color:#fff}

  table.doc{width:100%;border-collapse:collapse;font-size:17px;table-layout:fixed}
  table.doc td{
    background:var(--cream);border:1px solid var(--line);
    padding:3px 9px;vertical-align:middle;position:relative;
  }
  table.doc td.t-head,table.doc td.t-sub{
    background:var(--orange);color:#1c1c1c;font-weight:700;border:1px solid var(--line);
  }
  table.doc td.t-head{text-align:center;padding:5px 6px}
  table.doc td.t-head .ed{text-align:center}
  table.doc td.t-sub{text-align:left;padding:5px 9px}
  table.doc td.t-cat{font-weight:700;text-align:left;vertical-align:middle;padding:4px 6px;color:#413E3E}
  table.doc td.t-cat .ed{font-weight:700}

  /* 表格编辑模式 */
  .tblwrap.editing table.doc{touch-action:none}
  .tblwrap.editing table.doc .ed{pointer-events:none;user-select:none;-webkit-user-select:none}
  .tblwrap.editing table.doc td{cursor:cell}
  td.sel::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:rgba(27,117,187,.12);
    box-shadow:inset 0 0 0 2px var(--blue);
  }
  .tbl-overlay{position:absolute;pointer-events:none;z-index:6}
  .chandle{position:absolute;top:0;bottom:0;width:11px;margin-left:-5.5px;cursor:col-resize;pointer-events:auto}
  .chandle::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:#bfd6e6}
  .chandle:hover::after{background:var(--blue);width:2px;left:4.5px}
  .rhandle{position:absolute;left:0;right:0;height:11px;margin-top:-5.5px;cursor:row-resize;pointer-events:auto}
  .rhandle::after{content:"";position:absolute;top:5px;left:0;right:0;height:1px;background:#bfd6e6}
  .rhandle:hover::after{background:var(--blue);height:2px;top:4.5px}

  .tbl-tools{
    position:absolute;z-index:30;display:flex;gap:3px;flex-wrap:wrap;max-width:100%;
    background:#fff;border:1px solid #ccd8e2;border-radius:8px;padding:3px;
    box-shadow:0 6px 18px -8px rgba(0,0,0,.45);
  }
  .tbl-tools[hidden]{display:none}
  .tbl-tools button{
    font:inherit;font-size:14.5px;color:#31404c;background:#f7fafc;
    border:1px solid #dde5ec;border-radius:5px;padding:3px 8px;cursor:pointer;white-space:nowrap;
  }
  .tbl-tools button:hover:not(:disabled){background:#eaf3fa;border-color:#9dc4e2;color:var(--blue)}
  .tbl-tools button:disabled{opacity:.38;cursor:default}

  .addbtn{
    font:inherit;font-size:15px;color:var(--blue);background:transparent;
    border:1px dashed #b9c9d6;border-radius:6px;padding:3px 10px;cursor:pointer;
    margin:2px 0 4px;
  }
  .addbtn:hover{border-color:var(--blue);background:#f0f7fc}
  .cellbtn{
    border:0;background:transparent;color:#c9b98e;cursor:pointer;
    font-size:14px;line-height:1;padding:2px 6px;border-radius:4px;
    opacity:0;transition:.15s;
  }
  .cellbtn:hover{color:#b4453c;background:#f6e2df}
  .cellbtn.inline{position:static;flex:0 0 auto;opacity:.45}
  .item-head:hover .cellbtn.inline{opacity:1}

  /* ================= 正文输入区 ================= */
  .ed.block{padding:2px 4px;margin-bottom:2px}
  .ed.block.line{border-bottom:1px solid #e4e4e4;border-radius:0}
  .ed.block.line:focus{border-bottom-color:transparent;background:var(--focus)}

  /* ================= D 事项 ================= */
  .items{display:grid;gap:12px;margin:6px 0 4px}
  .item{border:1px solid #9fc2d6;border-radius:3px;overflow:hidden;background:#fff}
  .item-head{background:var(--lblue);color:#413E3E;display:flex;align-items:center;gap:4px;padding:3px 10px;font-weight:700}
  .item-head .no{flex:0 0 auto;font-weight:700}
  .item-head .ed{font-weight:700;flex:1 1 auto}
  .item-body{padding:5px 12px 9px}
  .fl{display:flex;align-items:flex-start;gap:8px;padding:1px 0}
  .fl .cb{margin-top:6px}
  .fl .sig{flex:0 0 auto;width:13px;text-align:center;color:#111;line-height:1.62}
  .fl .ed{flex:1 1 auto}

  /* ================= H / I ================= */
  .hline{display:flex;align-items:center;gap:2px;max-width:560px}
  .hline > span{flex:0 0 auto}
  .hline .ed{flex:1 1 auto}
  .habits{display:grid;gap:2px;margin-top:6px}
  .habit-group{display:grid;gap:2px}
  .habit-group + .habit-group{margin-top:10px}
  .hg-title{
    margin:0 0 3px;font-size:16px;font-weight:700;color:var(--blue);
    letter-spacing:.04em;padding:0 0 2px;border-bottom:1px solid #e3edf5;
  }
  .habit{display:flex;align-items:center;gap:8px}
  .habit .hname{flex:0 0 auto;white-space:nowrap}
  .habit .note{flex:0 1 340px;color:#C0562F;font-style:italic;font-size:16.5px}
  @media (max-width:620px){
    .brand{display:none}
    .topbar{padding:7px 8px;gap:5px}
    .topbar button{font-size:14px;padding:6px 9px;min-height:32px}
    .topbar button.icon{padding:6px 10px;min-height:32px}
    .modetabs{margin-right:0}
    .modetabs button{padding:6px 9px !important;font-size:14px !important}
    .topbar input[type="date"],
    .topbar input[type="week"],
    .topbar input[type="month"]{font-size:14px;padding:5px 6px;min-height:32px}
    .status{min-width:0;font-size:12.5px}
    .spacer{flex:1 1 24px}
    .more-btn{display:inline-block}
    .topbar:not(.more-open) .more-items{display:none}
    .topbar.more-open .more-items{
      display:flex;flex-wrap:wrap;align-items:center;gap:5px;
      flex:1 1 100%;margin-top:3px;padding-top:6px;border-top:1px solid #e6e6e6;
    }
    .cb{width:18px;height:18px}
    .cb:checked::after{left:4.3px;top:0.6px;width:5.2px;height:10.6px}
    .habit{flex-wrap:wrap}
    .habit .note{flex:1 1 100%}
  }

  /* ================= 选择模式：整页文字可连续框选 ================= */
  #app.select-mode{cursor:text}
  #app.select-mode .ed{background:transparent;box-shadow:none}
  body.cell-selecting,body.cell-selecting *{
    user-select:none !important;-webkit-user-select:none !important;
  }

  /* ================= 文字颜色浮条 ================= */
  .colorbar{
    position:fixed;z-index:200;display:flex;align-items:center;gap:6px;
    flex-wrap:wrap;max-width:calc(100vw - 16px);
    background:#fff;border:1px solid #ccd8e2;border-radius:10px;
    padding:4px 10px;box-shadow:0 8px 22px -10px rgba(0,0,0,.55);
    font-size:14px;color:#66727c;
  }
  .colorbar[hidden]{display:none}
  .colorbar .cb-label{white-space:nowrap;color:#939ea8}
  .colorbar .cb-sep{width:1px;height:18px;background:#dde5ec;margin:0 2px}
  .colorbar .sz{
    font:inherit;font-size:13.5px;font-weight:700;color:#31404c;background:#f7fafc;
    border:1px solid #dde5ec;border-radius:5px;padding:2px 7px;cursor:pointer;
  }
  .colorbar .sz:hover{background:#eaf3fa;border-color:#9dc4e2;color:var(--blue)}
  .colorbar .sz-clear{color:#a8402f;border-color:#e6c9c2}
  .colorbar .sz-clear:hover{background:#fdf1ef;border-color:#d9a99f;color:#a8402f}
  .colorbar .sw{
    width:18px;height:18px;border-radius:50%;padding:0;cursor:pointer;
    border:1px solid rgba(0,0,0,.18);background:#fff;transition:transform .12s;
  }
  .colorbar .sw:hover{transform:scale(1.14)}
  .colorbar .sw-none{
    background-image:linear-gradient(45deg,transparent 43%,#cf4b3c 43%,#cf4b3c 57%,transparent 57%);
  }

  .foot{text-align:center;color:#a9a9a9;font-size:14.5px;margin-top:34px}

  /* ================= 周报 ================= */
  .week-page{font-size:17px;--report-body-size:15px;--report-schedule-size:14px}

  .week-page .wk-table.schedule tbody tr:not(:first-child){font-size:var(--report-schedule-size)}
  .week-page .wk-reflect-row{font-size:var(--report-body-size)}
  .wk-title{
    margin:0 0 10px;padding:10px 12px;border-radius:5px;
    background:#1B75BB;color:#fff;text-align:center;
    font-size:23px;font-weight:700;letter-spacing:.08em;
  }
  .wk-draft{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:-8px 0 14px}
  .wk-draft .addbtn{margin:0}
  .wk-draft-note{font-size:13.5px;color:#9aa7b1}
  .wk-meta{
    display:flex;flex-wrap:wrap;align-items:center;gap:7px 22px;
    margin:0 0 18px;padding:8px 10px;border:1px solid #d5e1ea;border-radius:5px;
    background:#f7fbfe;font-size:16px;
  }
  .wk-meta label{display:flex;align-items:center;gap:4px;flex:1 1 auto;min-width:180px}
  .wk-meta label > span{flex:0 0 auto;color:#4f5d68}
  .wk-meta .ed{flex:1 1 auto;min-width:0;border-bottom:1px solid #c7d6e1;border-radius:0;padding:1px 5px}
  .wk-meta .ed:focus{border-bottom-color:transparent}
  .wk-tblwrap{position:relative;margin:5px 0 4px}
  .wk-tblwrap.editing table.doc{touch-action:none}
  .wk-tblwrap.editing table.doc .ed{
    pointer-events:none;user-select:none;-webkit-user-select:none;
  }
  .wk-table{margin:4px 0 0;font-size:16.5px}
  .wk-table td{vertical-align:top;padding:5px 7px}
  .wk-table td .ed{min-height:2.35em;padding:1px 3px;line-height:1.55}
  .wk-table td.t-head{text-align:center;vertical-align:middle;padding:7px 6px}
  .wk-table td.t-head .ed{text-align:center;min-height:0;font-weight:700}
  .wk-table td.wk-fix{
    text-align:center;vertical-align:middle;font-weight:700;color:#3f3f3f;
    background:#f6f7f8;
  }
  .wk-table td.wk-label-left{
    text-align:left;vertical-align:middle;font-weight:700;color:#3f3f3f;
    background:#f6f7f8;line-height:1.4;
  }
  .wk-table td.wk-dim{
    vertical-align:middle;text-align:center;font-weight:700;color:#fff;
    font-size:15px;padding:6px 4px;line-height:1.35;
  }
  .wk-table td.c-blue{background:#4472C4}
  .wk-table td.c-green{background:#70AD47}
  .wk-table td.c-yellow{background:#FFC000;color:#4a3500}
  .wk-table td.c-orange{background:#ED7D31}
  .wk-table td.c-red{background:#C00000}
  .wk-reflect{display:grid;gap:8px;margin-top:4px}
  .wk-reflect-row{
    display:grid;grid-template-columns:minmax(210px,26%) 1fr;
    border:1px solid var(--line);border-radius:2px;overflow:hidden;background:#fff;
  }
  .wk-reflect-q{
    display:flex;align-items:center;padding:8px 10px;
    background:#FFF3CF;border-right:1px solid var(--line);
    font-weight:700;color:#5d4a18;line-height:1.45;
  }
  .wk-reflect-a{min-height:76px;padding:5px 8px}
  .wk-reflect-a .ed{min-height:66px}
  .wk-summary{
    margin:4px 0 0;border:1px solid var(--line);border-radius:3px;background:#FFFDF3;
  }
  .wk-summary-label{
    padding:5px 10px;background:#F8E19B;border-bottom:1px solid var(--line);
    font-weight:700;color:#413E3E;
  }
  .wk-summary-body{padding:8px 10px}
  .wk-summary-body .ed{min-height:2.6em}
  .wk-empty-note{color:#8b8b8b;font-size:14px;margin:2px 0 0}

  @media (max-width:720px){
    .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tblwrap table.doc{min-width:680px}
    .week-page .sec-body{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .week-page .wk-table{min-width:720px}
    .wk-reflect-row{grid-template-columns:1fr}
    .wk-reflect-q{border-right:0;border-bottom:1px solid var(--line)}
    .wk-meta label{min-width:100%}
  }

  @media (max-width:620px){
    .goal{position:relative;flex-wrap:wrap;align-items:flex-start}
    .goal .g-title{flex:1 1 auto;min-width:0;padding-right:22px}
    .goal .g-sep{display:none}
    .goal .g-content{flex:1 1 100%;padding-left:18px}
    .goal .cellbtn{
      position:absolute;right:0;top:0;opacity:.45;
    }
  }

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
    background:#1a1a1a;color:#fff;padding:9px 18px;border-radius:9px;
    font-size:15.5px;opacity:0;pointer-events:none;transition:.22s;z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ================= 打印 ================= */
  @media print{
    @page{margin:12mm}
    html,body{background:#fff}
    body{font-size:14px}
    .topbar,.ghpanel,.findpanel,.addbtn,.cellbtn,.toolrow,.toast,.copynote,.foot,.wk-empty-note,
    .tbl-bar,.tbl-overlay,.tbl-tools,.colorbar{display:none !important}
    .page{box-shadow:none;margin:0;width:auto;padding:0;max-width:none}
    .banner,.item,.sec,table.doc tr,.goal{break-inside:avoid}
    .ed{background:transparent !important;box-shadow:none !important}
    .ed:empty::before{content:none !important}
    .wk-table{font-size:11.5px}
    .week-page{--report-body-size:11.5px;--report-schedule-size:11.5px}
    .week-page .wk-table td.wk-dim{font-size:12px}
    .wk-table td .ed{min-height:1.6em}
    .wk-table.frogs td{height:46px}
    .wk-table.colors td{height:42px}
    .wk-table.plan td{height:46px}
    .wk-table.schedule td{height:40px}
    .wk-table.goals td{height:34px}
    .wk-reflect-a{min-height:56px}
    .wk-reflect-a .ed{min-height:46px}
    .wk-reflect-row,.wk-summary{break-inside:avoid}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

  function todayISO(d){

  function isoWeekInfo(dateIso){

    const monday = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - ((dt.getDay() + 6) % 7));

    const jan4 = new Date(isoYear, 0, 4);
    const week1Mon = new Date(isoYear, 0, 4 - ((jan4.getDay() + 6) % 7));
    const week = Math.round((monday.getTime() - week1Mon.getTime()) / 604800000) + 1;
    const start = todayISO(monday);
    return { year:isoYear, week:week, key:isoYear + "-W" + pad2(week), start:start, end:shiftDate(start, 6) };

  function cleanHtml(html){
    /* 用 DOMParser 解析：生成的是没有浏览上下文的惰性文档，
       <img onerror> / <svg onload> 之类不会被加载或执行。
       直接往 detached div 里写 innerHTML 在 Chrome 下仍会触发这类加载。 */
    const src = new DOMParser().parseFromString(String(html == null ? "" : html), "text/html").body;
    const out = document.createElement("div");
    function walk(from, to){
      Array.prototype.slice.call(from.childNodes).forEach(function(n){
        if (n.nodeType === 3){ to.appendChild(document.createTextNode(n.nodeValue)); return; }
        if (n.nodeType !== 1) return;
        const tag = n.tagName.toLowerCase();
        if (tag === "br"){ to.appendChild(document.createElement("br")); return; }
        if (tag === "span"){
          const hex = rgbToHex(n.style && n.style.color);
          const fs = pxValue(n.style && n.style.fontSize);
          if (hex || fs){
            const sp = document.createElement("span");
            const css = [];
            if (hex) css.push("color:" + hex);
            if (fs) css.push("font-size:" + fs);
            sp.setAttribute("style", css.join(";"));
            walk(n, sp);
            to.appendChild(sp);

          return;
        }
        if (tag === "div" || tag === "p"){
          if (to.childNodes.length) to.appendChild(document.createElement("br"));
          walk(n, to);
          return;
        }
        walk(n, to);

    walk(src, out);
    const result = out.innerHTML;
    return blankText(htmlToText(result)) ? "" : result;
  }

  /* 把每一行编辑器的内容合并回 cell.v，并同步勾选状态 */
  function syncGoalCell(key, r, c){

    if (!cell) return;
    const wrap = appEl.querySelector('.tblwrap[data-table="' + key + '"]');
    const td = wrap && wrap.querySelector('td[data-r="' + r + '"][data-c="' + c + '"]');
    const box = td && td.querySelector(".goal-lines");

      const e = row.querySelector("[data-goal-line]");

  /* 回车：把光标后的内容拆成下一行，并给它一个新勾选框 */
  function addGoalLine(el, key, r, c, idx){

      const range = sel.getRangeAt(0);
      if (el.contains(range.endContainer)){
        const after = document.createRange();
        after.setStart(range.endContainer, range.endOffset);
        after.setEnd(el, el.childNodes.length);
        const frag = after.extractContents();

        tail = cleanHtml(tmp.innerHTML);

    const g = state.tables[key];
    const cell = g && g.cells[r] && g.cells[r][c];
    if (!cell) return;
    const lines = goalCellLines(cell);
    lines.splice(idx + 1, 0, { html: tail, checked: false });
    cell.v = lines.map(function(l){ return l.html; }).join("<br>");
    cell.checks = lines.map(function(l){ return l.checked; });
    cell.checked = false;
    scheduleSave();
    render();
    const next = appEl.querySelector('[data-goal-line="' + key + ',' + r + ',' + c + ',' + (idx + 1) + '"]');

  function monthlyGridFromGroups(groups){
    const C = 4;
    const cells = [[ makeCell("head","类别",{cs:2}), null, makeCell("head","目标内容"), makeCell("head","方法和措施") ]];
    (groups || []).forEach(function(grp){
      const rows = (grp && grp.rows) || [];
      if (!rows.length) return;
      rows.forEach(function(row, i){
        const line = new Array(C).fill(null);
        if (i === 0) line[0] = makeCell("cat", esc(str(grp.cat)), { rs: rows.length });
        line[1] = makeCell("body", esc(str(row.sub)));
        line[2] = makeCell("body", esc(str(row.content)));
        line[3] = makeCell("body", esc(str(row.method)));
        cells.push(line);
      });
    });
    if (cells.length === 1){
      cells.push([ makeCell("cat","",{rs:2}), makeCell("body",""), makeCell("body",""), makeCell("body","") ]);
      cells.push([ null, makeCell("body",""), makeCell("body",""), makeCell("body","") ]);
    }
    return makeGrid([15,15,40,30], cells);
  }

  function weeklyGridFrom(priority, otherTitle, other){
    const C = 2;
    const cells = [ [ makeCell("head","优先顺序"), makeCell("head","本周工作目标") ] ];
    (priority || []).forEach(function(r){
      cells.push([ makeCell("body", esc(str(r.code))), makeCell("body", esc(str(r.target))) ]);
    });
    const others = other || [];
    if (others.length){
      cells.push([ makeCell("sub", esc(str(otherTitle) || "本周其他目标"), { cs:C }), null ]);
      others.forEach(function(r){
        cells.push([ makeCell("cat", esc(str(r.cat))), makeCell("body", esc(str(r.items))) ]);
      });
    }
    return makeGrid([22,78], cells);
  }

  function sanitizeGrid(raw, h){
    if (!raw || !Array.isArray(raw.cols) || !Array.isArray(raw.cells) || !raw.cells.length) return null;
    const C = raw.cols.length;
    if (C < 1 || C > 12) return null;
    const cells = [];
    for (let r=0;r<raw.cells.length && r<400;r++){
      const row = raw.cells[r];
      if (!Array.isArray(row)) continue;
      const line = new Array(C).fill(null);
      for (let c=0;c<C;c++){
        const src = row[c];
        if (!src) continue;
        const t = CELL_TYPES.indexOf(src.t) >= 0 ? src.t : "body";
        const extra = {
          rs: Math.max(1, Math.min(60, Number(src.rs) || 1)),
          cs: Math.max(1, Math.min(12, Number(src.cs) || 1))
        };
        if (typeof src.checked === "boolean") extra.checked = src.checked;
        if (Array.isArray(src.checks)) extra.checks = src.checks.map(function(x){ return !!x; });
        line[c] = makeCell(t, h(src.v), extra);
      }
      cells.push(line);
    }
    if (!cells.length) return null;
    const body = canonical(cells, C);
    return {
      cols: normalizeCols(raw.cols),
      rows: body.map(function(_, i){
        const v = Array.isArray(raw.rows) ? raw.rows[i] : null;
        return (typeof v === "number" && v > 0) ? Math.min(800, v) : null;
      }),
      cells: body
    };
  }

  function normalize(raw){
    const s = emptyState();
    if (!raw || typeof raw !== "object") return s;

    /* v3 起字段值即 HTML；更早的版本按纯文本转义。
       v3 的内容同样过一遍白名单，避免从云端/导入文件带进标记。 */
    const isV3 = (Number(raw.__v) || 0) >= DATA_VERSION;
    const h = function(v){ return isV3 ? cleanHtml(str(v)) : esc(str(v)); };

    ["motto","dayWhat","place","sunrise","sunset","wake","sleep","annualTitle",
     "annualWorkLabel","annualLifeLabel","monthlyTitle","weeklyTitle",
     "B","C","E","F","G"].forEach(function(k){ s[k] = h(raw[k]) || s[k]; });

    if (Array.isArray(raw.morning))
      MORNING_QUESTIONS.forEach(function(_,i){ s.morning[i] = h(raw.morning[i]); });
    if (Array.isArray(raw.morningDone))
      MORNING_QUESTIONS.forEach(function(_,i){ s.morningDone[i] = !!raw.morningDone[i]; });

    ["work","life"].forEach(function(g){
      if (Array.isArray(raw[g]))
        s[g] = raw[g].map(function(r){ return { title:h(r&&r.title), content:h(r&&r.content) }; });
    });

    const mt = sanitizeGrid(raw.tables && raw.tables.monthly, h);
    const wt = sanitizeGrid(raw.tables && raw.tables.weekly, h);
    if (mt) s.tables.monthly = mt;
    else if (Array.isArray(raw.monthly)) s.tables.monthly = monthlyGridFromGroups(raw.monthly);

    if (wt) s.tables.weekly = wt;
    else if (Array.isArray(raw.weeklyPriority) || Array.isArray(raw.weeklyOther)){
      s.tables.weekly = weeklyGridFrom(raw.weeklyPriority, raw.weeklyOtherTitle, raw.weeklyOther);
    }

    if (Array.isArray(raw.D))
      s.D = raw.D.map(function(r){ return { title:h(r&&r.title), p:h(r&&r.p), m:h(r&&r.m), s:h(r&&r.s) }; });
    if (raw.H && typeof raw.H === "object")
      ["steps","exercise","diet"].forEach(function(k){ s.H[k] = h(raw.H[k]); });
    if (Array.isArray(raw.habits))
      s.habits = HABITS.map(function(_,i){
        const x = raw.habits[i] || {};
        return { checked: !!x.checked, note: h(x.note) };
      });

    /* 旧版整段颜色 → 包一层带颜色的 span */
    if (raw.colors && typeof raw.colors === "object"){
      Object.keys(raw.colors).forEach(function(path){
        const c = raw.colors[path];
        if (!rgbToHex(c)) return;
        const parts = path.split(".");
        let o = s;
        for (let i=0;i<parts.length-1;i++){
          o = o[parts[i]];
          if (!o) return;
        }
        const leaf = parts[parts.length-1];
        if (typeof o[leaf] !== "string") return;
        const html = o[leaf];
        if (!html) return;
        o[leaf] = '<span style="color:' + rgbToHex(c) + '">' + html + '</span>';
      });
    }

    s.sizes = normalizeSizes(raw.sizes);
    s.__blank = false;
    return s;
  }

  /* 只比较用户真正写下的文字，模板自带文字（表头、空表格等）不算内容 */
  function sameValue(a, b){
    if (a === b) return true;
    if (a == null || b == null) return a == null && b == null;
    if (typeof a !== typeof b) return false;
    if (typeof a !== "object") return typeof a === "string" ? a.trim() === b.trim() : a === b;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    if (Array.isArray(a)){
      if (a.length !== b.length) return false;
      for (let i=0;i<a.length;i++) if (!sameValue(a[i], b[i])) return false;
      return true;
    }
    const keys = Object.keys(b);
    for (let i=0;i<keys.length;i++){
      if (!sameValue(a[keys[i]], b[keys[i]])) return false;
    }
    return true;
  }

  /* 两张表是否都还停在模板原样（只看文字与勾选，列宽行高不算内容） */
  function sameGrid(a, b){
    if (!a || !b) return a === b;
    if (!Array.isArray(a.cols) || !Array.isArray(b.cols)) return false;
    if (a.cols.length !== b.cols.length) return false;
    const rowsA = a.cells || [], rowsB = b.cells || [];
    if (rowsA.length !== rowsB.length) return false;
    for (let r=0;r<rowsB.length;r++){
      const lineA = rowsA[r] || [], lineB = rowsB[r] || [];
      if (lineA.length !== lineB.length) return false;
      for (let c=0;c<lineB.length;c++){
        const ca = lineA[c], cb = lineB[c];
        if (!ca || !cb) { if (!!ca !== !!cb) return false; continue; }
        if ((ca.t || "") !== (cb.t || "")) return false;
        if (!!ca.checked !== !!cb.checked) return false;
        const ka = ca.checks || [], kb = cb.checks || [];
        if (ka.length !== kb.length) return false;
        for (let i=0;i<ka.length;i++){ if (!!ka[i] !== !!kb[i]) return false; }
        if (htmlToText(ca.v || "").trim() !== htmlToText(cb.v || "").trim()) return false;
      }
    }
    return true;
  }

  /* 这一篇是否等于空白模板：等于就说明还没写过东西 */
  function isBlankRecord(s){
    if (!s) return true;
    const b = emptyState();
    const skip = ["__v","__blank","dayWhat","sizes"];
    const keys = Object.keys(b);
    for (let i=0;i<keys.length;i++){
      const k = keys[i];
      if (skip.indexOf(k) >= 0) continue;
      if (k === "tables"){
        if (!sameGrid(s.tables && s.tables.monthly, b.tables.monthly)) return false;
        if (!sameGrid(s.tables && s.tables.weekly, b.tables.weekly)) return false;
        continue;
      }
      if (k === "morningDone" || k === "habits"){
        // 打卡勾选与习惯备注不单独算成"写过内容"
        const srcA = s[k] || [], srcB = b[k] || [];
        for (let j=0;j<srcB.length;j++){
          const a = srcA[j] || {}, bb = srcB[j] || {};
          if (htmlToText(a.note || "").trim() !== htmlToText(bb.note || "").trim()) return false;
        }
        continue;
      }
      if (!sameValue(s[k], b[k])) return false;
    }
    return true;
  }

  /* ============================================================

  const GH_KEYS = {

  const GH_IDLE_MS = 10000;

  function ghStatus(text, cls){

  function ghCfg(){
    const val = function(id){ const e = ghEl(id); return e ? String(e.value).trim() : ""; };
    const tok = val("ghToken");
    const autoEl = ghEl("ghAuto"), remEl = ghEl("ghRemember"), ovEl = ghEl("ghOverwrite");
    return {
      repo: val("ghRepo"), branch: val("ghBranch"), token: tok,

      remember: !!(remEl && remEl.checked),
      overwrite: !!(ovEl && ovEl.checked)

  function ghLoadMarks(){

  }
  function ghSaveMarks(m){
    try{ localStorage.setItem(GH_KEYS.marks, JSON.stringify(m)); }catch(e){}

  function ghTouchLast(){

  function ghHash(s){

  /* btoa/atob 处理不了中文，这里手动走 UTF-8 字节 */
  function b64encodeUtf8(str){

    for (let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64decodeUtf8(b64){

  function ghFriendly(err){

  async function ghCall(method, path, body){

    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); }, 30000);
    let res;
    try{
      res = await fetch("https://api.github.com" + path, {
        method: method,
        headers: {
          "Authorization": "Bearer " + cfg.token,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json"
        },
        body: body ? JSON.stringify(body) : undefined,
        signal: ctrl.signal
      });
    }catch(err){
      if (err && err.name === "AbortError") throw new Error("请求超时（30 秒），检查网络后重试");
      throw err;
    }finally{
      clearTimeout(timer);
    }
    if (!res.ok){
      let detail = "";
      try{ const j = await res.json(); detail = j && j.message ? j.message : ""; }catch(e){}
      const err = new Error(detail ? detail : "HTTP " + res.status);
      err.status = res.status;

  function ghRef(cfg){

    const body = { message: message, content: b64encodeUtf8(text) };

  function ghKindPrefix(kind){

  function ghKindFolder(kind){
    if (kind === "week") return GH_WEEK_FOLDER;
    if (kind === "month") return GH_MONTH_FOLDER;
    return GH_FOLDER;

  function ghMarkKey(kind, key){

    const cfg = ghCfg();
    const marks = ghLoadMarks();
    const mk = ghMarkKey(kind, key);

  function ghLocalKeys(kind){

  }

  /* ---------- 本机全量备份（不依赖 GitHub） ---------- */
  function localStorageUsage(){
    let bytes = 0;
    try{
      for (let i=0;i<localStorage.length;i++){
        const k = String(localStorage.key(i));

  }
  function localInfoStatus(text, cls){

  }
  function ghRefreshInfo(){
    const d = ghLocalKeys("day").length, w = ghLocalKeys("week").length, m = ghLocalKeys("month").length;
    const total = d + w + m;
    const kb = Math.max(1, Math.round(localStorageUsage() / 1024));
    const last = ghLastText();
    localInfoStatus(
      (total
        ? "本机 " + total + " 篇（日记 " + d + " / 周报 " + w + " / 月报 " + m + "）· 约 " + kb + " KB"
        : "本机还没有记录") +
      (last ? " · 上次云端备份 " + last : " · 还没有云端备份"),
      ""
    );
  }
  function collectAllRecords(){
    const out = { app:"diary", version:1, exportedAt:new Date().toISOString(), day:{}, week:{}, month:{} };
    const take = function(prefix, bucket){
      try{
        for (let i=0;i<localStorage.length;i++){
          const k = String(localStorage.key(i));
          if (k.indexOf(prefix) !== 0) continue;
          try{ out[bucket][k.slice(prefix.length)] = JSON.parse(localStorage.getItem(k)); }catch(e){}
        }
      }catch(e){}
    };
    take(LS_PREFIX, "day");
    take(LS_WEEK_PREFIX, "week");
    take(LS_MONTH_PREFIX, "month");
    return out;
  }
  function localExportAll(){
    const data = collectAllRecords();
    const n = Object.keys(data.day).length + Object.keys(data.week).length + Object.keys(data.month).length;
    if (!n){ localInfoStatus("本机还没有任何记录可以导出", "bad"); return; }
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], {type:"application/json;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "diary-backup-" + todayISO() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    const msg = "已导出全部 " + n + " 篇（" + Math.max(1, Math.round(json.length / 1024)) + " KB）";
    localInfoStatus(msg, "ok");
    toast(msg);
  }
  function localImportText(text){
    let data;
    try{ data = JSON.parse(text); }catch(e){
      localInfoStatus("导入失败：文件不是有效的 JSON", "bad");
      toast("导入失败：文件不是有效的 JSON");

    }
    if (!data || (!data.day && !data.week && !data.month)){
      localInfoStatus("导入失败：文件里没有 day / week / month 三组记录", "bad");
      toast("导入失败：不是本页导出的备份文件");
      return;
    }
    const overwrite = !!(ghEl("ghOverwrite") && ghEl("ghOverwrite").checked);
    let added = 0, replaced = 0, skipped = 0, failed = 0;
    const groups = [["day", LS_PREFIX], ["week", LS_WEEK_PREFIX], ["month", LS_MONTH_PREFIX]];
    groups.forEach(function(g){
      const kind = g[0], prefix = g[1], bucket = data[kind];
      if (!bucket || typeof bucket !== "object") return;
      Object.keys(bucket).forEach(function(k){
        const storageKey = prefix + k;
        const exists = !!localStorage.getItem(storageKey);
        if (exists && !overwrite){ skipped++; return; }
        const val = kind === "week" ? normalizeWeekly(bucket[k], k)
                  : kind === "month" ? normalizeMonthly(bucket[k], k)
                  : normalize(bucket[k]);
        try{ localStorage.setItem(storageKey, JSON.stringify(val)); }
        catch(e){ failed++; return; }
        if (exists) replaced++; else added++;

    });
    if (added || replaced){
      state = loadCurrent();
      sel = null;
      render();
      resetHistory();
    }
    const msg = "导入完成：新增 " + added + " 篇" + (replaced ? "，覆盖 " + replaced + " 篇" : "") +
                (skipped ? "，跳过本机已有 " + skipped + " 篇" : "") +
                (failed ? "，失败 " + failed + " 篇（本机存储已满）" : "");

  async function ghBackupAll(){
    const jobs = [];
    ghLocalKeys("day").forEach(function(k){ jobs.push({ kind:"day", key:k }); });
    ghLocalKeys("week").forEach(function(k){ jobs.push({ kind:"week", key:k }); });
    ghLocalKeys("month").forEach(function(k){ jobs.push({ kind:"month", key:k }); });
    if (!jobs.length) throw new Error("本机还没有任何日记、周报或月报");
    const cfg = ghCfg();
    const marks = ghLoadMarks();
    let ok = 0, fail = 0, skip = 0, dayOk = 0, weekOk = 0, monthOk = 0, firstErr = "";
    for (let i=0;i<jobs.length;i++){
      const job = jobs[i];
      ghStatus("备份中 " + (i+1) + "/" + jobs.length + "：" + ghRecordLabel(job.kind, job.key), "");
      const raw = localStorage.getItem(ghKindPrefix(job.kind) + job.key);
      if (marks[ghMarkKey(job.kind, job.key)] === ghHash(raw)){ skip++; continue; }
      try{
        const msg = job.kind === "week"
          ? "备份 " + weekDisplay(job.key) + " 的周报"
          : (job.kind === "month" ? "备份 " + monthDisplay(job.key) + " 的月报" : "备份 " + job.key + " 的日记");
        await ghPutFile(cfg, ghRecordPath(job.kind, job.key), ghPretty(raw), msg);
        marks[ghMarkKey(job.kind, job.key)] = ghHash(raw);
        ok++;
        if (job.kind === "week") weekOk++;
        else if (job.kind === "month") monthOk++;
        else dayOk++;
      }catch(err){
        fail++;
        if (!firstErr) firstErr = ghFriendly(err);
      }
    }
    ghSaveMarks(marks);
    if (ok) ghTouchLast();
    if (!ok){
      if (skip && !fail) return "全部 " + skip + " 篇云端已是最新，无需重复上传";
      throw new Error(firstErr || "全部失败");
    }
    return "已备份 " + ok + " 篇（日记 " + dayOk + " 篇，周报 " + weekOk + " 篇，月报 " + monthOk + " 篇）" +
           (skip ? "，跳过未变动 " + skip + " 篇" : "") +
           (fail ? "，失败 " + fail + " 篇（" + firstErr + "）" : "（" + ghTime() + "）");
  }
  async function ghListBackups(kind){
    const cfg = ghCfg();
    let items = [];
    try{
      items = await ghCall("GET", "/repos/" + cfg.repo + "/contents/" + ghKindFolder(kind) + ghRef(cfg));
    }catch(err){
      if (err.status === 404) return [];
      throw err;
    }
    const re = kind === "week"
      ? /^(\d{4}-W\d{2})\.json$/
      : (kind === "month" ? /^(\d{4}-\d{2})\.json$/ : /^(\d{4}-\d{2}-\d{2})\.json$/);
    return (Array.isArray(items) ? items : []).filter(function(it){
      return it.type === "file" && re.test(it.name);
    }).map(function(it){
      return { kind:kind, key:(re.exec(it.name) || [])[1], path:it.path, name:it.name };
    });
  }
  async function ghRestoreAll(){
    const cfg = ghCfg();
    const dayFiles = await ghListBackups("day");
    const weekFiles = await ghListBackups("week");
    const monthFiles = await ghListBackups("month");
    const files = dayFiles.concat(weekFiles, monthFiles);
    if (!files.length) throw new Error("云端 " + GH_FOLDER + "/、" + GH_WEEK_FOLDER + "/ 和 " + GH_MONTH_FOLDER + "/ 里还没有备份文件");
    let added = 0, replaced = 0, skipped = 0, failed = 0, firstErr = "";
    let dayAdded = 0, weekAdded = 0, monthAdded = 0;
    const marks = ghLoadMarks();
    for (let i=0;i<files.length;i++){
      const f = files[i];
      ghStatus("恢复中 " + (i+1) + "/" + files.length + "：" + ghRecordLabel(f.kind, f.key), "");
      const storageKey = ghKindPrefix(f.kind) + f.key;
      const exists = !!localStorage.getItem(storageKey);
      if (exists && !cfg.overwrite){ skipped++; continue; }
      try{
        const got = await ghCall("GET", "/repos/" + cfg.repo + "/contents/" + f.path + ghRef(cfg));
        const text = b64decodeUtf8(got && got.content);
        const obj = JSON.parse(text);
        const val = f.kind === "week"
          ? normalizeWeekly(obj, f.key)
          : (f.kind === "month" ? normalizeMonthly(obj, f.key) : normalize(obj));
        const stored = JSON.stringify(val);
        localStorage.setItem(storageKey, stored);
        marks[ghMarkKey(f.kind, f.key)] = ghHash(stored);
      }catch(err){
        failed++;
        if (!firstErr) firstErr = isQuotaError(err) ? "本机存储已满" : ghFriendly(err);
        continue;
      }
      if (exists) replaced++;
      else {
        added++;
        if (f.kind === "week") weekAdded++;
        else if (f.kind === "month") monthAdded++;
        else dayAdded++;
      }
    }

    if (added || replaced){
      state = loadCurrent();
      sel = null;
      render();
      resetHistory();
    }
    return "恢复完成：新增 " + added + " 篇（日记 " + dayAdded + " 篇，周报 " + weekAdded + " 篇，月报 " + monthAdded + " 篇）" +
           (replaced ? "，覆盖 " + replaced + " 篇" : "") +
           (skipped ? "，跳过本机已有 " + skipped + " 篇" : "") +
           (failed ? "，失败 " + failed + " 篇（" + firstErr + "）" : "");
  }
  function ghMaybeAuto(){
    const cfg = ghCfg();
    if (!cfg.auto || !cfg.token || !cfg.repo) return;

    ghAutoTimer = setTimeout(ghAutoBackupNow, GH_IDLE_MS);
  }
  function ghAutoBackupNow(){
    const cfg = ghCfg();
    if (!cfg.auto || !cfg.token || !cfg.repo) return;
    const kind = mode;
    const key = kind === "week" ? currentWeek : (kind === "month" ? currentMonth : currentDate);
    const raw = localStorage.getItem(ghKindPrefix(kind) + key);
    if (!raw) return;
    if (ghLoadMarks()[ghMarkKey(kind, key)] === ghHash(raw)) return;
    if (ghBusy){ ghMaybeAuto(); return; }
    ghBusy = true;
    ghStatus("自动备份中…", "");
    ghBackupRecord(kind, key, {force:true}).then(function(msg){
      ghBusy = false;
      ghStatus(msg, "ok");
    }).catch(function(err){
      ghBusy = false;
      ghStatus("自动备份失败：" + ghFriendly(err), "bad");
    });
  }
  function ghRun(start, label){
    if (ghBusy){ toast("正在处理，请稍候…"); return; }
    ghBusy = true;
    ghStatus(label + "…", "");
    Promise.resolve().then(start).then(function(msg){
      ghBusy = false;
      ghStatus(msg, "ok");
      toast(msg);
      ghRefreshInfo();
    }).catch(function(err){
      ghBusy = false;
      const m = ghFriendly(err);
      ghStatus("失败：" + m, "bad");
      toast("失败：" + m);
      ghRefreshInfo();
    });
  }
  function ghInit(){
    const btn = ghEl("ghBtn"), panel = ghEl("ghPanel");
    if (!btn || !panel) return;
    let repo = GH_DEFAULT_REPO, branch = "", tok = "", auto = false;
    try{
      repo = localStorage.getItem(GH_KEYS.repo) || GH_DEFAULT_REPO;
      branch = localStorage.getItem(GH_KEYS.branch) || "";
      tok = localStorage.getItem(GH_KEYS.token) || "";
      auto = localStorage.getItem(GH_KEYS.auto) === "1";
    }catch(e){}
    if (ghEl("ghRepo")) ghEl("ghRepo").value = repo;
    if (ghEl("ghBranch")) ghEl("ghBranch").value = branch;
    if (ghEl("ghToken")) ghEl("ghToken").value = tok;
    if (ghEl("ghAuto")) ghEl("ghAuto").checked = auto;
    if (ghEl("ghRemember")) ghEl("ghRemember").checked = !!tok;
    ghStatus(repo && tok ? "已配置：" + repo : (repo ? "已填仓库，还差 token" : "未配置"), repo && tok ? "ok" : "");
    ghRefreshInfo();

    function persist(){
      const c = ghCfg();
      try{
        localStorage.setItem(GH_KEYS.repo, c.repo);
        localStorage.setItem(GH_KEYS.branch, c.branch);
        localStorage.setItem(GH_KEYS.auto, c.auto ? "1" : "0");
        if (c.remember && c.token) localStorage.setItem(GH_KEYS.token, c.token);
        if (!c.remember) localStorage.removeItem(GH_KEYS.token);
      }catch(e){}
      ghStatus(c.token && c.repo ? "设置已保存：" + c.repo : "还差 token 或仓库名", c.token && c.repo ? "ok" : "");
    }
    btn.addEventListener("click", function(){
      const open = panel.classList.toggle("open");
      btn.classList.toggle("on", open);
      if (open){
        ghRefreshInfo();
        const r = !ghEl("ghRepo").value ? ghEl("ghRepo") : (!ghEl("ghToken").value ? ghEl("ghToken") : ghEl("ghRepo"));
        if (r) r.focus();
      }
    });

      if (ghEl("ghRemember")) ghEl("ghRemember").checked = false;
      ghStatus("已清除本机 token", "");
      toast("已清除本机保存的 token");
    });

    const importFile = ghEl("localImportFile");
    ghEl("localExport").addEventListener("click", localExportAll);
    ghEl("localImport").addEventListener("click", function(){
      if (importFile){ importFile.value = ""; importFile.click(); }
    });
    if (importFile){
      importFile.addEventListener("change", function(){
        const f = importFile.files && importFile.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = function(){ localImportText(String(rd.result || "")); };
        rd.onerror = function(){ localInfoStatus("读取文件失败", "bad"); };
        rd.readAsText(f, "utf-8");
      });
    }

  function tableHtml(key){
    const g = state.tables[key];
    while (g.rows.length < g.cells.length) g.rows.push(null);

    let body = "";
    g.cells.forEach(function(row, r){
      const hs = (typeof g.rows[r] === "number" && g.rows[r] > 0) ? ' style="height:' + g.rows[r] + 'px"' : "";
      body += "<tr" + hs + ">";
      row.forEach(function(cell, c){
        if (!cell) return;
        const rs = cell.rs || 1, cs = cell.cs || 1;
        let inner;
        if (isGoalCell(key, r, c, cell)){
          inner = '<div class="goal-lines">' + goalCellLines(cell).map(function(l, i){
            return '<div class="goal-line' + (l.checked ? ' done' : '') + '">' +
              '<input type="checkbox" class="cb" data-goal-check="' + key + ',' + r + ',' + c + ',' + i + '"' +

              '<div class="ed" contenteditable="true" role="textbox" aria-multiline="false"' +

                ' data-ph="…">' + (l.html || "") + '</div>' +
            '</div>';
          }).join("") + '</div>';
        }else{
          inner = ed("tables." + key + ".cells." + r + "." + c + ".v", cell.v, "…");
        }
        body += '<td class="t-' + cell.t + '" data-r="' + r + '" data-c="' + c + '"' +
                (rs > 1 ? ' rowspan="' + rs + '"' : "") +
                (cs > 1 ? ' colspan="' + cs + '"' : "") + '>' +
                inner + "</td>";
      });
      body += "</tr>";
    });

    const colgroup = "<colgroup>" + g.cols.map(function(w){ return '<col style="width:' + w + '%">'; }).join("") + "</colgroup>";

  function wkTableHtml(key, cls, rows){
    const meta = REPORT_TABLE_META[key];
    const lay = (state.layout && state.layout[key]) || { cols:meta.cols, rows:[] };
    const cols = (Array.isArray(lay.cols) && lay.cols.length === meta.cols.length) ? lay.cols : meta.cols;
    const heights = Array.isArray(lay.rows) ? lay.rows : [];
    const colgroup = "<colgroup>" + cols.map(function(w){
      return '<col style="width:' + w + '%">';
    }).join("") + "</colgroup>";
    const trs = rows.map(function(row, i){
      let c = 0;
      const withCoords = row.replace(/<td\b/g, function(){
        return '<td data-r="' + i + '" data-c="' + (c++) + '"';
      });
      const h = heights[i];
      return (typeof h === "number" && h > 0)
        ? withCoords.replace("<tr>", '<tr style="height:' + h + 'px">')
        : withCoords;
    }).join("");
    return '<div class="wk-tblwrap" data-wk-table="' + key + '">' +
      '<div class="tbl-bar">' +
        '<span class="tbl-hint" hidden>拖动单元格可框选，再用上方浮条上色 / 调字号 / 清空；拖边框调列宽与行高</span>' +

      '</div>' +
      '<table class="doc wk-table ' + cls + '">' + colgroup + '<tbody>' + trs + '</tbody></table>' +
      '<div class="tbl-overlay"></div>' +
    '</div>';
  }

  function applyWeeklyEditMode(){

  function buildWeeklyHandles(wrap, key){
    const table = wrap.querySelector("table.doc");
    const ov = wrap.querySelector(".tbl-overlay");
    if (!table || !ov) return;
    ov.innerHTML = "";
    const lay = state.layout && state.layout[key];
    if (!lay) return;

    const wr = wrap.getBoundingClientRect();
    const tr = table.getBoundingClientRect();
    ov.style.left = (tr.left - wr.left) + "px";
    ov.style.top = (tr.top - wr.top) + "px";
    ov.style.width = tr.width + "px";
    ov.style.height = tr.height + "px";

    let acc = 0;
    lay.cols.forEach(function(w, i){
      acc += w;
      if (i >= lay.cols.length - 1) return;
      const h = document.createElement("div");
      h.className = "chandle";
      h.dataset.col = String(i);
      h.style.left = ((acc / 100) * tr.width) + "px";
      ov.appendChild(h);
      wireWeeklyColHandle(h, i, key, wrap, table);
    });

    const trs = Array.prototype.slice.call(table.querySelectorAll("tr"));
    trs.forEach(function(rowEl, i){
      if (i >= trs.length - 1) return;
      const rr = rowEl.getBoundingClientRect();
      const h = document.createElement("div");
      h.className = "rhandle";
      h.dataset.row = String(i);
      h.style.top = (rr.bottom - tr.top) + "px";
      ov.appendChild(h);
      wireWeeklyRowHandle(h, i, rowEl, key, wrap);
    });
  }

  function wireWeeklyColHandle(h, i, key, wrap, table){
    h.addEventListener("pointerdown", function(e){
      e.preventDefault(); e.stopPropagation();
      const lay = state.layout[key];
      if (!lay) return;
      const j = (i + 1 < lay.cols.length) ? i + 1 : i - 1;
      if (j < 0) return;
      const tableW = table.getBoundingClientRect().width || 1;
      const startX = e.clientX;
      const a0 = lay.cols[i], b0 = lay.cols[j];
      const MIN = 5;
      const colEls = table.querySelectorAll("col");
      const onMove = function(ev){
        const d = ((ev.clientX - startX) / tableW) * 100;
        let a = a0 + d, b = b0 - d;
        if (a < MIN){ b -= (MIN - a); a = MIN; }
        if (b < MIN){ a -= (MIN - b); b = MIN; }
        lay.cols[i] = a; lay.cols[j] = b;
        if (colEls[i]) colEls[i].style.width = a + "%";
        if (colEls[j]) colEls[j].style.width = b + "%";
        buildWeeklyHandles(wrap, key);
      };
      const onUp = function(){
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        lay.cols = normalizeCols(lay.cols);
        Array.prototype.forEach.call(colEls, function(el, idx){
          if (el) el.style.width = lay.cols[idx] + "%";
        });
        scheduleSave();
        buildWeeklyHandles(wrap, key);
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    });
  }

  function wireWeeklyRowHandle(h, i, rowEl, key, wrap){
    h.addEventListener("pointerdown", function(e){
      e.preventDefault(); e.stopPropagation();
      const lay = state.layout[key];
      if (!lay) return;
      const startY = e.clientY;
      const h0 = rowEl.getBoundingClientRect().height;
      const onMove = function(ev){
        const val = Math.round(Math.max(24, Math.min(400, h0 + (ev.clientY - startY))));
        rowEl.style.height = val + "px";
        lay.rows[i] = val;
        buildWeeklyHandles(wrap, key);
      };
      const onUp = function(){
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        scheduleSave();
        buildWeeklyHandles(wrap, key);
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    });
    h.addEventListener("dblclick", function(e){
      e.preventDefault(); e.stopPropagation();
      const lay = state.layout[key];
      if (!lay) return;
      lay.rows[i] = null;
      rowEl.style.height = "";
      scheduleSave();
      render();
    });
  }

  function bumpEditorSize(el, delta){
    const path = el && el.dataset ? el.dataset.path : "";
    if (!path) return false;
    if (!state.sizes) state.sizes = {};
    const cur = Number(state.sizes[path]) || parseFloat(getComputedStyle(el).fontSize) || 17.5;
    const next = Math.max(10, Math.min(48, Math.round((cur + delta) * 10) / 10));
    state.sizes[path] = next;
    el.style.fontSize = next + "px";
    return true;
  }

  function applySizeToEditors(els, delta){
    if (!els || !els.length) return false;
    let count = 0;
    els.forEach(function(el){ if (bumpEditorSize(el, delta)) count++; });
    if (!count) return false;
    scheduleSave();
    toast("已调整 " + count + " 个单元格的字号");
    return true;
  }
