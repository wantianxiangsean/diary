  function updateToolbar(){
    appEl.querySelectorAll(".tblwrap").forEach(function(wrap){
      const key = wrap.dataset.table;
      const tools = wrap.querySelector(".tbl-tools");
      if (!tools) return;
      const show = editingTables[key] && sel && sel.key === key;
      tools.hidden = !show;
      if (!show) return;
      const g = state.tables[key];
      const list = anchorsIn(g, sel);
      const canSplit = list.some(function(x){ return (x.cell.rs||1) > 1 || (x.cell.cs||1) > 1; });
      tools.querySelector('[data-act="merge"]').disabled = list.length < 2;
      tools.querySelector('[data-act="split"]').disabled = !canSplit;
      tools.querySelector('[data-act="row-delete"]').disabled = g.cells.length <= 1;
    });
    positionToolbar();
  }

  function positionToolbar(){
    if (!sel) return;
    const wrap = appEl.querySelector('.tblwrap[data-table="' + sel.key + '"]');
    if (!wrap) return;
    const tools = wrap.querySelector(".tbl-tools");
    if (!tools || tools.hidden) return;
    const tds = wrap.querySelectorAll("td.sel");
    if (!tds.length) return;
    const wr = wrap.getBoundingClientRect();
    let left = Infinity, top = Infinity, bottom = -Infinity;
    tds.forEach(function(td){
      const r = td.getBoundingClientRect();
      if (r.left < left) left = r.left;
      if (r.top < top) top = r.top;
      if (r.bottom > bottom) bottom = r.bottom;
    });
    const th = tools.offsetHeight || 32;
    let y = top - wr.top - th - 6;
    if (y < 0) y = bottom - wr.top + 6;
    let x = left - wr.left;
    x = Math.max(0, Math.min(x, Math.max(0, wr.width - tools.offsetWidth)));
    tools.style.left = x + "px";
    tools.style.top = y + "px";
  }

  /* ---------- 网格结构操作 ---------- */
  function commit(fn){
    fn();
    state.tables.monthly.cols = normalizeCols(state.tables.monthly.cols);
    state.tables.weekly.cols = normalizeCols(state.tables.weekly.cols);
    scheduleSave();
    render();
  }

  function doMerge(){
    if (!sel) return;
    const key = sel.key, rect = sel;
    commit(function(){
      const g = state.tables[key];
      const list = anchorsIn(g, rect);
      if (list.length < 2) return;
      const parts = list.map(function(x){ return x.cell.v; })
        .filter(function(v){ return htmlToText(v).trim(); });
      const topCell = g.cells[rect.r1][rect.c1] || list[0].cell;
      for (let r=rect.r1;r<=rect.r2;r++)
        for (let c=rect.c1;c<=rect.c2;c++) g.cells[r][c] = null;
      g.cells[rect.r1][rect.c1] = makeCell(topCell.t, cleanHtml(parts.join("<br>")), {
        rs: rect.r2 - rect.r1 + 1,
        cs: rect.c2 - rect.c1 + 1
      });
      g.cells = canonical(g.cells, g.cols.length);
      g.rows = g.cells.map(function(_, i){ return g.rows[i] || null; });
      sel = null;
    });
    toast("已合并");
  }

  function doSplit(){
    if (!sel) return;
    const key = sel.key, rect = sel;
    commit(function(){
      const g = state.tables[key];
      const list = anchorsIn(g, rect).filter(function(x){ return (x.cell.rs||1) > 1 || (x.cell.cs||1) > 1; });
      if (!list.length) return;
      list.forEach(function(x){
        const rs = x.cell.rs || 1, cs = x.cell.cs || 1;
        const t = x.cell.t;
        x.cell.rs = 1; x.cell.cs = 1;
        for (let i=x.r;i<x.r+rs;i++){
          for (let j=x.c;j<x.c+cs;j++){
            if (i === x.r && j === x.c) continue;
            g.cells[i][j] = makeCell(t, "");
          }
        }
      });
      g.cells = canonical(g.cells, g.cols.length);
      sel = null;
    });
    toast("已拆分");
  }

  function doClear(){
    if (!sel) return;
    const key = sel.key, rect = sel;
    commit(function(){
      const g = state.tables[key];
      anchorsIn(g, rect).forEach(function(x){ x.cell.v = ""; });
    });
    toast("已清除内容");
  }

  /* 插入行：插在选区下方（选区的合并格会跟着延长） */
  function doInsertRow(){
    if (!sel) return;
    const key = sel.key, rect = sel;
    const at = rect.r2 + 1;
    commit(function(){
      const g = state.tables[key];
      const C = g.cols.length;
      for (let r=0;r<Math.min(at, g.cells.length);r++){
        for (let c=0;c<C;c++){
          const cell = g.cells[r][c];
          if (!cell) continue;
          const rs = cell.rs || 1;
          if (r + rs > at) cell.rs = rs + 1;
        }
      }
      g.cells.splice(at, 0, new Array(C).fill(null));
      g.rows.splice(at, 0, null);
      const cov = coverage(g.cells, C);
      for (let c=0;c<C;c++){
        if (!cov[at][c]) g.cells[at][c] = makeCell("body", "");
      }
      g.cells = canonical(g.cells, C);
      g.rows = g.cells.map(function(_, i){ return g.rows[i] || null; });
      sel = null;
    });
    toast("已插入一行");
  }

  /* 删除行：删掉选区覆盖的行（被切到的合并格会缩短） */
  function doDeleteRow(){
    if (!sel) return;
    const key = sel.key;
    const from = sel.r1, to = sel.r2;
    commit(function(){
      const g = state.tables[key];
      const C = g.cols.length;
      const count = to - from + 1;
      if (g.cells.length - count < 1) return;
      for (let r=0;r<g.cells.length;r++){
        for (let c=0;c<C;c++){
          const cell = g.cells[r][c];
          if (!cell) continue;
          const rs = cell.rs || 1;
          const overlap = Math.max(0, Math.min(r + rs - 1, to) - Math.max(r, from) + 1);
          if (overlap > 0) cell.rs = Math.max(1, rs - overlap);
        }
      }
      g.cells.splice(from, count);
      g.rows.splice(from, count);
      const cov = coverage(g.cells, C);
      for (let r=0;r<g.cells.length;r++){
        for (let c=0;c<C;c++){
          if (!g.cells[r][c] && !cov[r][c]) g.cells[r][c] = makeCell("body","");
        }
      }
      g.cells = canonical(g.cells, C);
      g.rows = g.cells.map(function(_, i){ return g.rows[i] || null; });
      sel = null;
    });
    toast("已删除选中行");
  }

  /* ============================================================
     文字颜色：只给选中的片段上色
     ============================================================ */
  function editorOf(node){
    let el = node;
    while (el && el !== appEl){
      if (el.nodeType === 1 && el.classList && el.classList.contains("ed")){
        return el.getAttribute("contenteditable") === "true" ? el : null;
      }
      el = el.parentNode;
    }
    return null;
  }

  function initColorBar(){
    colorBar = document.createElement("div");
    colorBar.className = "colorbar";
    colorBar.hidden = true;
    const html = ['<span class="cb-label">选中文字后点色块</span>'];
    colorBar.setAttribute("role", "toolbar");
    colorBar.setAttribute("aria-label", "文字颜色与字号");
    COLOR_SWATCHES.forEach(function(s){
      html.push('<button type="button" class="sw' + (s.c ? "" : " sw-none") + '" data-color="' + s.c +
                '" title="' + s.t + '" aria-label="' + s.t + '"' + (s.c ? ' style="background:' + s.c + '"' : "") + '></button>');
    });
    html.push('<span class="cb-sep"></span><span class="cb-label">字号</span>');
    html.push('<button type="button" class="sz" data-size="-1" title="减小字号">A−</button>');
    html.push('<button type="button" class="sz" data-size="1" title="增大字号">A+</button>');
    html.push('<span class="cb-sep"></span><button type="button" class="sz sz-clear" data-act="clear" title="清空选区里的内容" hidden>清空</button>');
    colorBar.innerHTML = html.join("");
    colorBar.dataset.mode = "text";
    document.body.appendChild(colorBar);

    colorBar.addEventListener("mousedown", function(e){ e.preventDefault(); });
    colorBar.addEventListener("click", function(e){
      const gridMode = colorBar.dataset.mode === "grid";
      const z = e.target.closest("[data-size]");
      if (z){
        e.preventDefault();
        if (!(gridMode && applySizeToGridSelection(Number(z.dataset.size)))) applySizeToSelection(Number(z.dataset.size));
        return;
      }
      const clr = e.target.closest("[data-act='clear']");
      if (clr){ e.preventDefault(); clearGridSelection(); return; }
      const b = e.target.closest("[data-color]");
      if (!b) return;
      e.preventDefault();
      if (gridMode) applyColorToGridSelection(b.dataset.color || "");
      else applyColorToSelection(b.dataset.color || "");
    });

    document.addEventListener("selectionchange", onSelectionChange);
  }

  function onSelectionChange(){
    if (selectMode){ hideColorBar(); return; }
    const gridActive = !!(reportSel || (sel && !editingTables[sel.key]));
    const s = window.getSelection();
    if (!s || s.rangeCount === 0 || s.isCollapsed){
      if (gridActive){ showGridColorBar(); return; }
      hideColorBar(); return;
    }
    const a = editorOf(s.anchorNode), f = editorOf(s.focusNode);
    if (!a || a !== f){
      if (gridActive){ showGridColorBar(); return; }
      hideColorBar(); return;
    }
    showColorBar(a, s.getRangeAt(0));
  }

  function showColorBar(el, range){
    if (!colorBar) return;
    const r = range.getBoundingClientRect();
    if (!r || (!r.width && !r.height)) { hideColorBar(); return; }
    setColorBarMode("text");
    positionColorBar(r.left, r.top, r.bottom);
  }
  function setColorBarMode(mode, count){
    if (!colorBar) return;
    colorBar.dataset.mode = mode;
    const c = colorBar.querySelector("[data-act='clear']");
    if (c) c.hidden = mode !== "grid";
    const label = colorBar.querySelector(".cb-label");
    if (label) label.textContent = mode === "grid"
      ? (count ? "已选 " + count + " 格" : "已选一片格子")
      : "选中文字后点色块";
  }
  function positionColorBar(left, top, bottom){
    if (!colorBar) return;
    colorBar.hidden = false;
    const w = colorBar.offsetWidth, h = colorBar.offsetHeight;
    let y = top - h - 8;
    if (y < 8) y = Math.min(window.innerHeight - h - 8, bottom + 8);
    const x = Math.min(Math.max(8, left), Math.max(8, window.innerWidth - w - 8));
    colorBar.style.top = Math.max(8, y) + "px";
    colorBar.style.left = x + "px";
  }
  /* 表格里框选了多个格子时，把浮条定位到选区上方（日记表格与周报/月报表格通用） */
  function gridSelectionWrap(){
    if (reportSel) return appEl.querySelector('.wk-tblwrap[data-wk-table="' + reportSel.key + '"]');
    if (sel) return appEl.querySelector('.tblwrap[data-table="' + sel.key + '"]');
    return null;
  }
  function showGridColorBar(){
    if (!colorBar) return;
    const wrap = gridSelectionWrap();
    if (!wrap) return;
    const tds = wrap.querySelectorAll("td.sel");
    if (!tds.length) return;
    let left = Infinity, top = Infinity, bottom = -Infinity;
    tds.forEach(function(td){
      const r = td.getBoundingClientRect();
      if (r.left < left) left = r.left;
      if (r.top < top) top = r.top;
      if (r.bottom > bottom) bottom = r.bottom;
    });
    setColorBarMode("grid", tds.length);
    positionColorBar(left, top, bottom);
  }
  function hideColorBar(){ if (colorBar) colorBar.hidden = true; }

  function applyColorToSelection(color){
    const s = window.getSelection();
    if (!s || s.rangeCount === 0 || s.isCollapsed) return;
    const el = editorOf(s.anchorNode);
    if (!el || el !== editorOf(s.focusNode)) return;
    try{
      if (color){
        document.execCommand("styleWithCSS", false, true);
        document.execCommand("foreColor", false, color);
      }else{
        document.execCommand("styleWithCSS", false, true);
        document.execCommand("removeFormat", false, null);
      }
    }catch(e){ return; }
    const path = el.dataset.path;
    if (path){
      setPath(path, cleanHtml(el.innerHTML));
      scheduleSave();
    }
    toast(color ? "已给选中文字上色" : "已去掉选中文字的颜色");
  }

  /* 去掉格子里原有的颜色，再整体套一层新颜色 */
  function recolorHtml(html, color){
    const body = new DOMParser().parseFromString('<div id="__r">' + String(html || "") + '</div>', "text/html").body;
    const root = body.firstChild;
    if (!root) return "";
    Array.prototype.slice.call(root.querySelectorAll("span")).forEach(function(sp){
      if (!sp.style || !sp.style.color) return;
      sp.style.removeProperty("color");
      if (sp.getAttribute("style")) return;
      const parent = sp.parentNode;
      while (sp.firstChild) parent.insertBefore(sp.firstChild, sp);
      parent.removeChild(sp);
    });
    if (color){
      const w = body.ownerDocument.createElement("span");
      w.setAttribute("style", "color:" + color);
      while (root.firstChild) w.appendChild(root.firstChild);
      root.appendChild(w);
    }
    return root.innerHTML;
  }

  function applyColorToGridSelection(color){
    const els = activeGridEditors();
    if (!els.length) return false;
    let n = 0;
    els.forEach(function(el){
      const path = el.dataset.path;
      if (!path) return;
      const next = cleanHtml(recolorHtml(el.innerHTML, color));
      setPath(path, next);
      el.innerHTML = next;
      n++;
    });
    if (!n) return false;
    scheduleSave();
    toast(color ? "已给 " + n + " 个格子的文字上色" : "已去掉 " + n + " 个格子的文字颜色");
    return true;
  }

  function clearGridSelection(){
    const els = activeGridEditors();
    if (!els.length) return false;
    els.forEach(function(el){
      const path = el.dataset.path;
      if (path) setPath(path, "");
      el.innerHTML = "";
    });
    scheduleSave();
    toast("已清空 " + els.length + " 个格子");
    return true;
  }

  function selectionFontSize(){
    const s = window.getSelection();
    if (!s || s.rangeCount === 0) return 0;
    let n = s.anchorNode;
    if (n && n.nodeType === 3) n = n.parentNode;
    if (!n || n.nodeType !== 1) return 0;
    const v = parseFloat(getComputedStyle(n).fontSize);
    return isFinite(v) ? v : 0;
  }

  function applySizeToSelection(delta){
    const s = window.getSelection();
    if (!s || s.rangeCount === 0 || s.isCollapsed) return false;
    const el = editorOf(s.anchorNode);
    if (!el || el !== editorOf(s.focusNode)) return false;
    const cur = selectionFontSize() || parseFloat(getComputedStyle(el).fontSize) || 17.5;
    const next = Math.max(10, Math.min(48, Math.round((cur + delta) * 10) / 10));
    const range = s.getRangeAt(0);
    const span = document.createElement("span");
    span.style.fontSize = next + "px";
    span.appendChild(range.extractContents());
    range.insertNode(span);
    s.removeAllRanges();
    const r2 = document.createRange();
    r2.selectNodeContents(span);
    s.addRange(r2);
    const path = el.dataset.path;
    if (path){
      setPath(path, cleanHtml(el.innerHTML));
      scheduleSave();
    }
    toast("选中文字字号 " + next + "px");
    return true;
  }

  function changeEditorFontSize(delta){
    if (applySizeToReportSelection(delta)) return;
    if (applySizeToGridSelection(delta)) return;
    if (applySizeToSelection(delta)) return;
    let el = document.activeElement;
    if (!el || !el.classList || !el.classList.contains("ed")){
      const s = window.getSelection();
      if (s && s.rangeCount) el = editorOf(s.anchorNode);
    }
    if (!el || el.getAttribute("contenteditable") !== "true"){
      toast("先点进要编辑的文字");
      return;
    }
    const path = el.dataset.path;
    if (!path) return;
    if (!bumpEditorSize(el, delta)) return;
    scheduleSave();
    toast("字号 " + state.sizes[path] + "px");
  }

  /* ============================================================
     事件绑定
     ============================================================ */
  /* ---------- 上一步 / 下一步（整篇回退，防误操作） ---------- */
  let past = [], future = [], present = "";

  function snapshotNow(){
    const now = JSON.stringify(state);
    if (now === present) return;
    if (present) past.push(present);
    if (past.length > 80) past.shift();
    present = now;
    future = [];
    refreshUndoButtons();
  }
  function resetHistory(){
    past = []; future = [];
    present = JSON.stringify(state);
    refreshUndoButtons();
  }
  function restoreState(json){
    try{ state = JSON.parse(json); }catch(e){ return; }
    save();
    render();
    setStatus("已保存","saved");
    refreshUndoButtons();
  }
  function doUndo(){
    snapshotNow();
    if (!past.length){ toast("没有可回退的步骤了"); return; }
    future.push(present);
    present = past.pop();
    restoreState(present);
    toast("已回到上一步");
  }
  function doRedo(){
    if (!future.length){ toast("没有可恢复的步骤了"); return; }
    past.push(present);
    present = future.pop();
    restoreState(present);
    toast("已恢复下一步");
  }
  function refreshUndoButtons(){
    const u = document.getElementById("undoBtn"), r = document.getElementById("redoBtn");
    if (u) u.disabled = past.length === 0;
    if (r) r.disabled = future.length === 0;
  }

  function bind(){
    appEl.querySelectorAll(".ed").forEach(function(el){
      const path = el.dataset.path;
      if (!path) return;
      const sync = function(){
        if (editorIsEmpty(el)){
          el.innerHTML = "";
          setPath(path, "");
        }else{
          setPath(path, cleanHtml(el.innerHTML));
        }
        scheduleSave();
      };
      const ensureEmpty = function(){
        if (editorIsEmpty(el)) el.innerHTML = "";
      };
      ensureEmpty();
      el.addEventListener("focus", ensureEmpty);
      el.addEventListener("input", sync);
      el.addEventListener("blur", sync);
      el.addEventListener("keydown", function(e){
        if (e.key === "Enter" && el.dataset.single === "1") e.preventDefault();
      });
      el.addEventListener("paste", function(e){
        e.preventDefault();
        const t = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
        document.execCommand("insertText", false, t);
      });
      el.addEventListener("drop", function(e){ e.preventDefault(); });
    });

    appEl.querySelectorAll("[data-check]").forEach(function(el){
      const path = el.dataset.check;
      el.addEventListener("change", function(){ setPath(path, el.checked); scheduleSave(); });
    });
    appEl.querySelectorAll("[data-goal-check]").forEach(function(cb){
      cb.addEventListener("change", function(){
        const parts = cb.dataset.goalCheck.split(",");
        const key = parts[0], r = Number(parts[1]), c = Number(parts[2]), i = Number(parts[3]);
        const g = state.tables[key];
        const cell = g && g.cells[r] && g.cells[r][c];
        if (!cell) return;
        const lines = goalCellLines(cell);
        const checks = lines.map(function(l){ return l.checked; });
        checks[i] = cb.checked;
        cell.checks = checks;
        cell.checked = checks.length > 0 && checks.every(Boolean);
        const row = cb.closest(".goal-line");
        if (row) row.classList.toggle("done", cb.checked);
        scheduleSave();
      });
    });

    appEl.querySelectorAll("[data-goal-line]").forEach(function(el){
      const parts = el.dataset.goalLine.split(",");
      const key = parts[0], r = Number(parts[1]), c = Number(parts[2]), idx = Number(parts[3]);
      const sync = function(){ syncGoalCell(key, r, c); };
      el.addEventListener("focus", function(){ if (editorIsEmpty(el)) el.innerHTML = ""; });
      el.addEventListener("input", sync);
      el.addEventListener("blur", sync);
      el.addEventListener("keydown", function(e){
        if (e.key !== "Enter") return;
        e.preventDefault();
        addGoalLine(el, key, r, c, idx);
      });
      el.addEventListener("paste", function(e){
        e.preventDefault();
        const t = (e.clipboardData || window.clipboardData).getData("text/plain") || "";
        document.execCommand("insertText", false, t.replace(/[\r\n]+/g, " "));
      });
      el.addEventListener("drop", function(e){ e.preventDefault(); });
    });

    appEl.querySelectorAll("[data-add]").forEach(function(btn){
      btn.addEventListener("click", function(){
        const t = btn.dataset.add;
        snapshotNow();
        if (t === "work" || t === "life") state[t].push({ title:"", content:"" });
        else if (t === "D") state.D.push({ title:"", p:"", m:"", s:"" });
        else if (t === "monthly.row"){
          const g = state.tables.monthly;
          g.cells.push(g.cols.map(function(){ return makeCell("body",""); }));
          g.rows.push(null);
        }
        else if (t === "monthly.group"){
          const g = state.tables.monthly;
          const row = g.cols.map(function(){ return makeCell("body",""); });
          row[0] = makeCell("cat","");
          g.cells.push(row);
          g.rows.push(null);
        }
        else if (t === "weekly.pri"){
          const g = state.tables.weekly;
          let at = g.cells.length;
          for (let i=0;i<g.cells.length;i++){
            if (g.cells[i].some(function(c){ return c && c.t === "sub"; })){ at = i; break; }
          }
          g.cells.splice(at, 0, g.cols.map(function(){ return makeCell("body",""); }));
          g.rows.splice(at, 0, null);
        }
        else if (t === "weekly.other"){
          const g = state.tables.weekly;
          if (!g.cells.some(function(row){ return row.some(function(c){ return c && c.t === "sub"; }); })){
            g.cells.push([ makeCell("sub","本周其他目标",{cs:2}), null ]);
            g.rows.push(null);
          }
          g.cells.push([ makeCell("cat",""), makeCell("body","") ]);
          g.rows.push(null);
        }
        scheduleSave();
        render();
      });
    });

    appEl.querySelectorAll("[data-remove]").forEach(function(btn){
      btn.addEventListener("click", function(){
        const p = btn.dataset.remove.split(".");
        const arr = state[p[0]];
        const i = Number(p[1]);
        snapshotNow();
        if (Array.isArray(arr) && arr.length > 1) arr.splice(i, 1);
        scheduleSave();
        render();
      });
    });

    /* 继承提示条 */
    appEl.querySelectorAll("[data-act]").forEach(function(btn){
      btn.addEventListener("click", function(){
        const a = btn.dataset.act;
        if (a === "copy-dismiss"){ copyNotice = null; render(); return; }
        if (a === "copy-blank"){
          snapshotNow();
          copyNotice = null;
          state = emptyState();
          state.dayWhat = cnDate(currentDate);
          snapshotNow();
          save(); setStatus("已保存","saved");
          render();
          toast("已改用空白");
        }
      });
    });
    appEl.querySelectorAll("[data-tbl-toggle]").forEach(function(btn){
      btn.addEventListener("click", function(){
        const key = btn.dataset.tblToggle;
        editingTables[key] = !editingTables[key];
        sel = null;
        render();
      });
    });
    appEl.querySelectorAll("[data-wk-toggle]").forEach(function(btn){
      btn.addEventListener("click", function(){
        const key = btn.dataset.wkToggle;
        editingTables[key] = !editingTables[key];
        render();
      });
    });

    appEl.querySelectorAll(".tbl-tools button").forEach(function(btn){
      btn.addEventListener("click", function(){
        const a = btn.dataset.act;
        snapshotNow();
        if (a === "merge") doMerge();
        else if (a === "split") doSplit();
        else if (a === "clear") doClear();
        else if (a === "row-insert") doInsertRow();
        else if (a === "row-delete") doDeleteRow();
      });
    });

    appEl.querySelectorAll(".tblwrap").forEach(function(wrap){
      const key = wrap.dataset.table;
      wrap.addEventListener("pointerdown", function(e){
        if (e.target.closest(".chandle,.rhandle,.tbl-tools,.tbl-toggle,.cb,[data-week-check]")) return;
        const td = e.target.closest("td");
        if (!td || td.dataset.r == null) return;
        const g = state.tables[key];
        const r0 = Number(td.dataset.r), c0 = Number(td.dataset.c);
        const editing = !!editingTables[key];
        /* 手机上拖拽留给横向滚动，框选走「表格编辑」 */
        if (!editing && e.pointerType === "touch") return;
        let selecting = editing;
        if (editing){
          e.preventDefault();
          dragging = { key:key, r0:r0, c0:c0 };
          const rect0 = expandRect(g, r0, c0, r0, c0);
          sel = { key:key, r1:rect0.r1, c1:rect0.c1, r2:rect0.r2, c2:rect0.c2 };
          paintSel();
          updateToolbar();
        }

        const onMove = function(ev){
          const el = document.elementFromPoint(ev.clientX, ev.clientY);
          const t2 = el && el.closest ? el.closest("td") : null;
          if (!t2 || !wrap.contains(t2) || t2.dataset.r == null) return;
          const rr = Number(t2.dataset.r), cc = Number(t2.dataset.c);
          if (!selecting){
            /* 还在起始格内：让浏览器照常选文字，跨到别的格子才转成框选 */
            if (rr === r0 && cc === c0) return;
            selecting = true;
            dragging = { key:key, r0:r0, c0:c0 };
            document.body.classList.add("cell-selecting");
            const s0 = window.getSelection();
            if (s0) s0.removeAllRanges();
          }
          ev.preventDefault();
          const ex = expandRect(g, Math.min(r0, rr), Math.min(c0, cc), Math.max(r0, rr), Math.max(c0, cc));
          sel = { key:key, r1:ex.r1, c1:ex.c1, r2:ex.r2, c2:ex.c2 };
          paintSel();
          if (editing) updateToolbar(); else showGridColorBar();
        };
        const onUp = function(){
          dragging = null;
          document.body.classList.remove("cell-selecting");
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          window.removeEventListener("pointercancel", onUp);
          if (editing) updateToolbar();
          else if (sel) showGridColorBar();
        };
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      });
    });
    appEl.querySelectorAll(".wk-tblwrap").forEach(function(wrap){
      const key = wrap.dataset.wkTable;
      wrap.addEventListener("pointerdown", function(e){
        if (e.target.closest(".chandle,.rhandle,.tbl-toggle,.tbl-tools,.cb,[data-week-check]")) return;
        const td = e.target.closest("td");
        if (!td || td.dataset.r == null) return;
        const r0 = Number(td.dataset.r), c0 = Number(td.dataset.c);
        const editing = !!editingTables[key];
        /* 手机上拖拽留给横向滚动，框选走「表格编辑」 */
        if (!editing && e.pointerType === "touch") return;
        let selecting = editing;
        if (editing){
          e.preventDefault();
          reportSel = { key:key, r1:r0, c1:c0, r2:r0, c2:c0 };
          paintReportSelection();
          showGridColorBar();
        }
        const onMove = function(ev){
          const el = document.elementFromPoint(ev.clientX, ev.clientY);
          const t2 = el && el.closest ? el.closest("td") : null;
          if (!t2 || !wrap.contains(t2) || t2.dataset.r == null) return;
          const rr = Number(t2.dataset.r), cc = Number(t2.dataset.c);
          if (!selecting && rr === r0 && cc === c0) return;
          if (!selecting){
            selecting = true;
            document.body.classList.add("cell-selecting");
          }
          reportSel = {
            key:key,
            r1:Math.min(r0, rr), c1:Math.min(c0, cc),
            r2:Math.max(r0, rr), c2:Math.max(c0, cc)
          };
          paintReportSelection();
          const s = window.getSelection();
          if (s) s.removeAllRanges();
          ev.preventDefault();
          showGridColorBar();
        };
        const onUp = function(){
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          window.removeEventListener("pointercancel", onUp);
          document.body.classList.remove("cell-selecting");
          if (reportSel) showGridColorBar();
        };
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
        window.addEventListener("pointercancel", onUp);
      });
    });

    const wkDraftBtn = document.getElementById("wkDraftBtn");
    if (wkDraftBtn) wkDraftBtn.addEventListener("click", weeklyDraftFill);
    const moDraftBtn = document.getElementById("moDraftBtn");
    if (moDraftBtn) moDraftBtn.addEventListener("click", monthlyDraftFill);
  }

  function gridMarkdown(key, L){
    const g = state.tables[key];
    if (!g || !g.cells.length) return;
    const rows = g.cells.map(function(row, r){
      return row.map(function(cell, c){
        if (!cell) return "";
        if (isGoalCell(key, r, c, cell)){
          return goalCellLines(cell).map(function(l){
            const t = htmlToText(l.html).trim();
            return t ? (l.checked ? "[x] " : "[ ] ") + t : "";
          }).filter(Boolean).join("；");
        }
        return htmlToText(cell.v);
      }).map(cellMd);
    });
    const C = g.cols.length;
    const head = rows[0] || [];
    while (head.length < C) head.push("");
    L.push("| " + head.join(" | ") + " |");
    L.push("| " + head.map(function(){ return "---"; }).join(" | ") + " |");
    rows.slice(1).forEach(function(r){
      while (r.length < C) r.push("");
      L.push("| " + r.join(" | ") + " |");
    });
  }

  function refreshChrome(){
    const isDay = mode === "day";
    const isWeek = mode === "week";
    const isMonth = mode === "month";
    const brand = document.getElementById("brand");
    if (brand) brand.textContent = isMonth ? "每月月报" : (isWeek ? "每周周报" : "每日日记");
    document.querySelectorAll(".day-only").forEach(function(el){ el.hidden = !isDay; });
    document.querySelectorAll(".week-only").forEach(function(el){ el.hidden = !isWeek; });
    document.querySelectorAll(".month-only").forEach(function(el){ el.hidden = !isMonth; });
    const md = document.getElementById("modeDay"), mw = document.getElementById("modeWeek");
    const mm = document.getElementById("modeMonth");
    if (md){ md.classList.toggle("on", isDay); md.setAttribute("aria-pressed", isDay ? "true" : "false"); }
    if (mw){ mw.classList.toggle("on", isWeek); mw.setAttribute("aria-pressed", isWeek ? "true" : "false"); }
    if (mm){ mm.classList.toggle("on", isMonth); mm.setAttribute("aria-pressed", isMonth ? "true" : "false"); }
    const cp = document.getElementById("copyPrev");
    if (cp){
      cp.textContent = isMonth ? "复制上月" : (isWeek ? "复制上周" : "复制昨天");
      cp.title = isMonth
        ? "把最近一份填写过的月报复制到本月"
        : (isWeek ? "把最近一份填写过的周报复制到本周" : "把最近一份填写过的日记复制到本篇");
    }
    const clr = document.getElementById("clearDay");
    if (clr) clr.title = isMonth ? "清空这一月" : (isWeek ? "清空这一周" : "清空这一篇");
    document.getElementById("datePick").value = currentDate;
    const wp = document.getElementById("weekPick");
    if (wp) wp.value = currentWeek;
    const mp = document.getElementById("monthPick");
    if (mp) mp.value = currentMonth;
    document.title = isMonth
      ? monthDisplay(currentMonth) + " 月报"
      : (isWeek ? weekDisplay(currentWeek) + " 周报" : currentDate + " 日记");
  }

  function switchMode(next){
    if (next === mode) return;
    save();
    if (next === "week"){
      if (!weekPinned) currentWeek = weekKeyFromDate(currentDate);
      mode = "week";
      state = loadWeek(currentWeek);
    }else if (next === "month"){
      if (!monthPinned) currentMonth = monthKeyFromDate(currentDate);
      mode = "month";
      state = loadMonth(currentMonth);
    }else{
      mode = "day";
      state = loadDay(currentDate);
    }
    sel = null; dragging = null;
    editingTables = { monthly:false, weekly:false };
    refreshChrome();
    render();
    resetHistory();
    setStatus(state.__blank ? "" : "已保存", state.__blank ? "" : "saved");
  }
  function downloadMd(){
    const isMonth = mode === "month";
    const isWeek = mode === "week";
    const md = isMonth ? monthlyToMarkdown() : (isWeek ? weeklyToMarkdown() : toMarkdown());
    const blob = new Blob([md], {type:"text/markdown;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = isMonth ? currentMonth + "-月报.md" : (isWeek ? currentWeek + "-周报.md" : currentDate + "-日记.md");
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    toast("已导出 " + a.download);
  }

  let findIndex = null;

  function findEl(id){ return document.getElementById(id); }

  /* 递归收集记录里的纯文字，跳过字号/布局和自动生成的日期抬头 */
  function recordText(obj, out){
    if (!obj || typeof obj !== "object") return out;
    const isCell = typeof obj.t === "string" && CELL_TYPES.indexOf(obj.t) >= 0;
    Object.keys(obj).forEach(function(k){
      if (k === "sizes" || k === "layout" || k === "__v") return;
      if (k === "dayWhat" || k === "weekNo" || k === "dateRange" || k === "time") return;
      if (k === "annualWorkLabel" || k === "annualLifeLabel") return;
      /* 表头与固定标签不算正文 */
      if (isCell && k === "v" && obj.t !== "body" && obj.t !== "check") return;
      const v = obj[k];
      if (k === "t" && typeof v === "string" && CELL_TYPES.indexOf(v) >= 0) return;
      if (typeof v === "string"){
        const t = htmlToText(v).replace(/\s+/g, " ").trim();
        if (t) out.push(t);
      }else if (v && typeof v === "object"){
        recordText(v, out);
      }
    });
    return out;
  }

  function buildFindIndex(){
    const items = [];
    const add = function(kind, prefix, key, blankFn, label, sortKey){
      let raw = null;
      try{ raw = localStorage.getItem(prefix + key); }catch(e){ return; }
      if (!raw) return;
      let obj = null;
      try{ obj = JSON.parse(raw); }catch(e){ return; }
      if (blankFn(obj)) return;
      items.push({
        kind: kind, key: key, label: label, sortKey: sortKey,
        text: recordText(obj, []).join(" · ")
      });
    };
    let keys = [];
    try{ keys = Object.keys(localStorage); }catch(e){ keys = []; }
    keys.forEach(function(k){
      if (k.indexOf(LS_PREFIX) === 0){
        const d = k.slice(LS_PREFIX.length);
        add("day", LS_PREFIX, d, isBlankRecord, cnDate(d), d);
      }else if (k.indexOf(LS_WEEK_PREFIX) === 0){
        const w = k.slice(LS_WEEK_PREFIX.length);
        add("week", LS_WEEK_PREFIX, w, isBlankWeekly, weekDisplay(w), weekStartFromKey(w));
      }else if (k.indexOf(LS_MONTH_PREFIX) === 0){
        const m = k.slice(LS_MONTH_PREFIX.length);
        add("month", LS_MONTH_PREFIX, m, isBlankMonthly, monthDisplay(m), m + "-01");
      }
    });
    items.sort(function(a, b){ return a.sortKey < b.sortKey ? 1 : (a.sortKey > b.sortKey ? -1 : 0); });
    return items;
  }

  function findSnippet(text, q){
    if (!q) return text.slice(0, 110);
    const i = text.toLowerCase().indexOf(q);
    if (i < 0) return text.slice(0, 110);
    const start = Math.max(0, i - 24);
    return (start > 0 ? "…" : "") + text.slice(start, i + q.length + 80);
  }

  function findHighlight(text, q){
    if (!q) return esc(text);
    const lower = text.toLowerCase();
    const out = [];
    let from = 0, i = lower.indexOf(q);
    while (i >= 0){
      out.push(esc(text.slice(from, i)));
      out.push("<mark>" + esc(text.slice(i, i + q.length)) + "</mark>");
      from = i + q.length;
      i = lower.indexOf(q, from);
    }
    out.push(esc(text.slice(from)));
    return out.join("");
  }

  function renderFind(){
    const box = findEl("findResults"), countEl = findEl("findCount");
    if (!box || !findIndex) return;
    const q = String((findEl("findInput") || {}).value || "").trim().toLowerCase();
    let d = 0, w = 0, m = 0;
    findIndex.forEach(function(it){ if (it.kind === "day") d++; else if (it.kind === "week") w++; else m++; });
    if (countEl) countEl.textContent = "共 " + d + " 篇日记 · " + w + " 篇周报 · " + m + " 篇月报";

    const list = q ? findIndex.filter(function(it){ return it.text.toLowerCase().indexOf(q) >= 0; }) : findIndex;
    if (!list.length){
      box.innerHTML = '<div class="fempty">' +
        (q ? "没找到包含“" + esc(q) + "”的记录" : "本机还没有写过内容") + '</div>';
      return;
    }
    const limit = q ? 60 : 30;
    const head = q
      ? "找到 " + list.length + " 条" + (list.length > limit ? "，显示前 " + limit + " 条" : "")
      : "最近写过";
    box.innerHTML = '<div class="fgroup">' + esc(head) + '</div>' + list.slice(0, limit).map(function(it){
      return '<button type="button" class="fitem" role="listitem" data-kind="' + it.kind + '" data-key="' + esc(it.key) + '">' +
        '<span class="ftitle">' + esc(it.label) + '</span>' +
        '<span class="fkind">' + (it.kind === "week" ? "周报" : (it.kind === "month" ? "月报" : "日记")) + '</span>' +
        '<div class="fsnip">' + findHighlight(findSnippet(it.text, q), q) + '</div>' +
      '</button>';
    }).join("");
  }

  function openFind(){
    const panel = findEl("findPanel");
    if (!panel) return;
    panel.classList.add("open");
    const btn = findEl("findBtn");
    if (btn) btn.classList.add("on");
    findIndex = buildFindIndex();
    renderFind();
    const inp = findEl("findInput");
    if (inp && !window.matchMedia("(pointer: coarse)").matches) inp.focus();
  }
  function closeFind(){
    const panel = findEl("findPanel");
    if (!panel) return;
    panel.classList.remove("open");
    const btn = findEl("findBtn");
    if (btn) btn.classList.remove("on");
  }
  function findIsOpen(){
    const panel = findEl("findPanel");
    return !!(panel && panel.classList.contains("open"));
  }
  function jumpToRecord(kind, key){
    closeFind();
    if (kind === "week") gotoWeek(key);
    else if (kind === "month") gotoMonth(key);
    else goto(key);
    window.scrollTo(0, 0);
  }
  function bindFind(){
    const btn = findEl("findBtn");
    if (btn) btn.addEventListener("click", function(){ if (findIsOpen()) closeFind(); else openFind(); });
    const close = findEl("findClose");
    if (close) close.addEventListener("click", closeFind);
    const inp = findEl("findInput");
    if (inp) inp.addEventListener("input", function(){
      clearTimeout(findTimer);
      findTimer = setTimeout(renderFind, 120);
    });
    const box = findEl("findResults");
    if (box) box.addEventListener("click", function(e){
      const item = e.target.closest(".fitem");
      if (!item) return;
      jumpToRecord(item.dataset.kind, item.dataset.key);
    });
  }

  /* ============================================================
     周报草稿：按本周 7 天的日记自动填一版（只填空位）
     ============================================================ */
  function plainText(html){
    return htmlToText(html || "").replace(/\s+/g, " ").trim();
  }
  function textLines(html){
    return htmlToText(html || "").split(/\n+/)
      .map(function(s){ return s.replace(/\s+/g, " ").trim(); })
      .filter(Boolean);
  }
  function joinUnique(list, max){
    const seen = {}, out = [];
    list.forEach(function(x){
      const v = String(x || "").trim();
      if (!v || seen[v]) return;
      seen[v] = 1;
      out.push(v);
    });
    const s = out.join("；");
    return max && s.length > max ? s.slice(0, max) + "…" : s;
  }
  /* 多行内容按原样换行保留（用在「觉察」「卡点」这类清单型字段） */
  function joinLines(list){
    const seen = {}, out = [];
    list.forEach(function(x){
      textLines(x).forEach(function(line){
        if (seen[line]) return;
        seen[line] = 1;
        out.push(line);
      });
    });
    return out.join("\n");
  }
  function getPathValue(path){
    const p = String(path).split(".");
    let o = state;
    for (let i=0;i<p.length;i++){
      if (o == null) return "";
      o = o[p[i]];
    }
    return o == null ? "" : o;
  }
  function weekDraftAssignments(){
    const start = weekStartFromKey(currentWeek);
    const days = [];
    for (let i=0;i<7;i++){
      const iso = shiftDate(start, i);
      const s = loadDay(iso);
      if (!isBlankRecord(s)) days.push({ iso: iso, s: s });
    }
    const assign = [];
    const add = function(path, text){ if (text) assign.push({ path: path, value: esc(text) }); };

    const frogPlans = [];
    const good = [], bad = [];
    const health = [], learn = [], social = [], money = [];

    days.forEach(function(d){
      const s = d.s;
      const first = textLines(s.B)[0];
      if (first) frogPlans.push({ plan: first, actual: plainText(s.C) });
      (s.D || []).forEach(function(r){
        const tag = d.iso.slice(5).replace("-", "/");
        const title = plainText(r.title);
        const head = title ? tag + " " + title : tag;
        if (plainText(r.p)) good.push(head + "：" + plainText(r.p));
        if (plainText(r.m)) bad.push(head + "：" + plainText(r.m));
      });
      [s.H && s.H.exercise, s.H && s.H.diet].forEach(function(x){
        if (plainText(x)) health.push(plainText(x));
      });
      if (plainText(s.G)) learn.push(plainText(s.G));
      if (plainText(s.F)) social.push(plainText(s.F));
      if (plainText(s.E)) money.push(plainText(s.E));
    });

    /* 三只青蛙：每天取第一条高能要事，填进还空着的行；已经在表里的不再重复填 */
    const existing = (state.frogs || []).map(function(r){ return plainText(r.plan); });
    let slot = 0;
    frogPlans.forEach(function(f){
      if (existing.indexOf(plainText(f.plan)) >= 0) return;
      while (slot < 3 && existing[slot]) slot++;
      if (slot >= 3) return;
      add("frogs." + slot + ".plan", f.plan);
      add("frogs." + slot + ".actual", f.actual);
      existing[slot] = plainText(f.plan);
      slot++;
    });
    add("colors.1.actual", joinUnique(health, 240));
    add("colors.2.actual", joinUnique(learn, 240));
    add("colors.3.actual", joinUnique(social, 240));
    if (good.length) add("reflect.good", good.slice(0, 6).map(function(x){ return "• " + x; }).join("\n"));
    if (bad.length) add("reflect.bad", bad.slice(0, 6).map(function(x){ return "• " + x; }).join("\n"));

    const goalSrc = { "健康身体":health, "学习成长":learn, "人际社群":social, "理财财务":money };
    WEEK_GOALS.forEach(function(dim, i){
      const src = goalSrc[dim];
      if (src) add("goals." + i + ".progress", joinUnique(src, 200));
    });

    return { days: days.length, assign: assign };
  }
  function weeklyDraftFill(){
    const draft = weekDraftAssignments();
    if (!draft.days){ toast("本周还没有写过日记"); return; }
    const list = draft.assign.filter(function(a){ return !plainText(getPathValue(a.path)); });
    if (!list.length){ toast("周报里已经没有空位可填了"); return; }
    snapshotNow();
    list.forEach(function(a){ setPath(a.path, a.value); });
    render(); save();
    snapshotNow();
    setStatus("已保存", "saved");
    toast("已按本周 " + draft.days + " 天的日记填入 " + list.length + " 处，可继续修改");
  }

  function monthlyDraftFill(){
    const draft = monthDraftAssignments();
    if (!draft.weeks){ toast("这个月还没有写过周报"); return; }
    const list = draft.assign.filter(function(a){ return !plainText(getPathValue(a.path)); });
    if (!list.length){ toast("月报里已经没有空位可填了"); return; }
    snapshotNow();
    list.forEach(function(a){ setPath(a.path, a.value); });
    render(); save();
    snapshotNow();
    setStatus("已保存", "saved");
    toast("已按本月 " + draft.weeks + " 份周报填入 " + list.length + " 处，可继续修改");
  }

  /* 这个月覆盖到的 ISO 周 */
  function monthWeekKeys(mk){
    const p = String(mk || currentMonth).split("-").map(Number);
    if (!p[0] || !p[1]) return [];
    const last = new Date(p[0], p[1], 0).getDate();
    const keys = [];
    for (let d=1; d<=last; d++){
      const k = weekKeyFromDate(p[0] + "-" + pad2(p[1]) + "-" + pad2(d));
      if (keys.indexOf(k) < 0) keys.push(k);
    }
    return keys;
  }
  function monthDraftAssignments(){
    const weeks = [];
    monthWeekKeys(currentMonth).forEach(function(k){
      const s = loadWeek(k);
      if (!isBlankWeekly(s)) weeks.push({ key: k, s: s });
    });
    const assign = [];
    const add = function(path, text){ if (text) assign.push({ path: path, value: esc(text) }); };

    const health = [], family = [], learn = [], aware = [];
    const done = [], todo = [], lessons = [], nextItems = [];

    weeks.forEach(function(w){
      const s = w.s;
      (s.colors || []).forEach(function(c, i){
        const a = plainText(c.actual);
        if (!a) return;
        if (i === 1) health.push(a);
        else if (i === 2) learn.push(a);
        else if (i === 3) family.push(a);
      });
      const bad = plainText(s.reflect && s.reflect.bad);
      const act = plainText(s.reflect && s.reflect.action);
      if (bad) aware.push(s.reflect.bad);
      if (bad || act) lessons.push({
        phenomenon: textLines(s.reflect && s.reflect.bad).join("\n"),
        action: textLines(s.reflect && s.reflect.action).join("\n")
      });
      (s.frogs || []).forEach(function(f){
        const p = plainText(f.plan);
        if (!p) return;
        const a = plainText(f.actual);
        if (a) done.push(p + "（" + a + "）");
        else todo.push(p);
      });
    });
    const lastWeek = weeks[weeks.length - 1];
    if (lastWeek){
      (lastWeek.s.nextFrogs || []).forEach(function(n){
        const t = plainText(n.item);
        if (t) nextItems.push(t);
      });
    }

    /* 八大关注：健康 0 / 家庭 1 / 觉察 5 / 成长 7 */
    add("focus.0.text", joinUnique(health, 400));
    add("focus.1.text", joinUnique(family, 400));
    add("focus.5.text", joinLines(aware));
    add("focus.7.text", joinUnique(learn, 400));

    /* 本月三只青蛙：先放已经完成的，再补没完成的 */
    done.concat(todo).slice(0, 3).forEach(function(t, i){
      add("frogs." + i + ".text", t);
    });

    lessons.slice(0, 3).forEach(function(l, i){
      add("lessons." + i + ".phenomenon", l.phenomenon);
      add("lessons." + i + ".action", l.action);
    });
    nextItems.slice(0, 3).forEach(function(t, i){
      add("nextFrogs." + i + ".text", t);
    });

    return { weeks: weeks.length, assign: assign };
  }

  function init(){
    statusEl = document.getElementById("status");
    appEl = document.getElementById("app");
    try{ document.execCommand("defaultParagraphSeparator", false, "br"); }catch(e){}

    const hasAny = (function(){
      try{
        for (let i=0;i<localStorage.length;i++){
          if (String(localStorage.key(i)).indexOf(LS_PREFIX) === 0) return true;
        }
      }catch(e){}
      return false;
    })();

    state = loadDay(currentDate);
    if (!hasAny && state.__blank){ state = templateState(); save(); }

    initColorBar();
    refreshChrome();
    render();
    resetHistory();
    setStatus(state.__blank ? "" : "已保存", state.__blank ? "" : "saved");

    document.getElementById("datePick").addEventListener("change", function(e){ if (e.target.value) goto(e.target.value); });
    document.getElementById("prevDay").addEventListener("click", function(){ goto(shiftDate(currentDate,-1)); });
    document.getElementById("nextDay").addEventListener("click", function(){ goto(shiftDate(currentDate, 1)); });
    document.getElementById("todayBtn").addEventListener("click", function(){ goto(todayISO()); });
    document.getElementById("modeDay").addEventListener("click", function(){ switchMode("day"); });
    document.getElementById("modeWeek").addEventListener("click", function(){ switchMode("week"); });
    document.getElementById("modeMonth").addEventListener("click", function(){ switchMode("month"); });
    document.getElementById("prevWeek").addEventListener("click", function(){ gotoWeek(shiftWeekKey(currentWeek, -1)); });
    document.getElementById("nextWeek").addEventListener("click", function(){ gotoWeek(shiftWeekKey(currentWeek, 1)); });
    document.getElementById("thisWeekBtn").addEventListener("click", function(){ gotoWeek(todayWeekKey()); });
    document.getElementById("weekPick").addEventListener("change", function(e){ if (e.target.value) gotoWeek(e.target.value); });
    document.getElementById("prevMonth").addEventListener("click", function(){ gotoMonth(shiftMonthKey(currentMonth, -1)); });
    document.getElementById("nextMonth").addEventListener("click", function(){ gotoMonth(shiftMonthKey(currentMonth, 1)); });
    document.getElementById("thisMonthBtn").addEventListener("click", function(){ gotoMonth(todayMonthKey()); });
    document.getElementById("monthPick").addEventListener("change", function(e){ if (e.target.value) gotoMonth(e.target.value); });
    document.getElementById("copyPrev").addEventListener("click", function(){
      if (mode === "month"){
        const prev = findPrevMonthRecord(currentMonth);
        if (!prev){ toast("往前 12 个月没有填写过的月报"); return; }
        if (!isBlankMonthly(state) && !confirm("用 " + monthDisplay(prev.key) + " 的月报内容覆盖当前这一月？")) return;
        snapshotNow();
        state = inheritMonthly(prev.state, currentMonth);
        snapshotNow();
        save(); setStatus("已保存","saved");
        render();
        toast("已填入 " + monthDisplay(prev.key) + " 的月报内容");
        return;
      }
      if (mode === "week"){
        const prev = findPrevWeekRecord(currentWeek);
        if (!prev){ toast("往前 52 周内没有填写过的周报"); return; }
        if (!isBlankWeekly(state) && !confirm("用 " + weekDisplay(prev.key) + " 的周报内容覆盖当前这一周？")) return;
        snapshotNow();
        state = inheritWeekly(prev.state, currentWeek);
        snapshotNow();
        save(); setStatus("已保存","saved");
        render();
        toast("已填入 " + weekDisplay(prev.key) + " 的周报内容");
        return;
      }
      const prev = findPrevRecord(currentDate);
      if (!prev){ toast("往前 30 天内没有填写过的记录"); return; }
      if (!isBlankRecord(state) && !confirm("用 " + cnDate(prev.date) + " 的内容覆盖当前这一篇？")) return;
      snapshotNow();
      state = inheritState(prev.state, currentDate);
      snapshotNow();
      save(); setStatus("已保存","saved");
      render();
      toast("已填入 " + cnDate(prev.date) + " 的内容");
    });

    document.getElementById("fillTpl").addEventListener("click", function(){
      const what = mode === "month" ? "当前这一月" : (mode === "week" ? "当前这一周" : "当前这一篇");
      if (!confirm("用示例内容覆盖" + what + "？当前内容会被替换。")) return;
      snapshotNow();
      state = mode === "month"
        ? monthlyTemplateState(currentMonth)
        : (mode === "week" ? weeklyTemplateState(currentWeek) : templateState());
      snapshotNow();
      sel = null;
      render(); save(); setStatus("已保存","saved");
      toast("已载入示例内容");
    });
    document.getElementById("clearDay").addEventListener("click", function(){
      const what = mode === "month"
        ? monthDisplay(currentMonth) + " 这一月"
        : (mode === "week" ? weekDisplay(currentWeek) + " 这一周" : currentDate + " 这一篇");
      if (!confirm("清空 " + what + "的全部内容？")) return;
      snapshotNow();
      if (mode === "month"){
        state = emptyMonthlyState(currentMonth);
      }else if (mode === "week"){
        state = emptyWeeklyState(currentWeek);
      }else{
        state = emptyState();
        state.dayWhat = cnDate(currentDate);
      }
      snapshotNow();
      sel = null;
      render(); save(); setStatus("已保存","saved");
      toast(mode === "month" ? "已清空本月" : (mode === "week" ? "已清空本周" : "已清空本篇"));
    });
    document.getElementById("exportMd").addEventListener("click", downloadMd);
    document.getElementById("undoBtn").addEventListener("click", doUndo);
    document.getElementById("redoBtn").addEventListener("click", doRedo);
    const fontMinus = document.getElementById("fontMinus");
    const fontPlus = document.getElementById("fontPlus");
    [fontMinus, fontPlus].forEach(function(btn){
      btn.addEventListener("mousedown", function(e){ e.preventDefault(); });
    });
    fontMinus.addEventListener("click", function(){ changeEditorFontSize(-1); });
    fontPlus.addEventListener("click", function(){ changeEditorFontSize(1); });
    document.addEventListener("pointerdown", function(e){
      document.body.classList.remove("cell-selecting");
      if (!reportSel) return;
      const t = e.target;
      if (t && t.closest && t.closest(".colorbar,#fontMinus,#fontPlus")) return;
      reportSel = null;
      paintReportSelection();
      hideColorBar();
    }, true);

    /* 普通状态下点别处，收掉表格框选 */
    document.addEventListener("pointerdown", function(e){
      document.body.classList.remove("cell-selecting");
      if (!sel) return;
      if (editingTables[sel.key]) return;
      const t = e.target;
      if (t && t.closest && t.closest(".colorbar,#fontMinus,#fontPlus,.tbl-tools")) return;
      sel = null;
      paintSel();
      hideColorBar();
    }, true);

    window.addEventListener("scroll", function(){
      if (colorBar && !colorBar.hidden && colorBar.dataset.mode === "grid") hideColorBar();
    }, true);

    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && findIsOpen()){ closeFind(); return; }
      if (e.key === "Escape" && selectMode){
        selectMode = false;
        const sm = document.getElementById("selectMode");
        if (sm) sm.classList.remove("on");
        render();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "z"){
        e.preventDefault();
        if (e.shiftKey) doRedo(); else doUndo();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "y"){
        e.preventDefault(); doRedo(); return;
      }
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "s"){
        e.preventDefault(); save(); setStatus("已保存","saved"); toast("已保存");
      }
    });

    window.addEventListener("beforeprint", function(){
      appEl.querySelectorAll(".tbl-overlay").forEach(function(o){ o.innerHTML = ""; });
    });
    window.addEventListener("afterprint", function(){
      appEl.querySelectorAll(".tblwrap.editing").forEach(function(w){ buildHandles(w, w.dataset.table); });
      appEl.querySelectorAll(".wk-tblwrap.editing").forEach(function(w){ buildWeeklyHandles(w, w.dataset.wkTable); });
      paintSel();
      updateToolbar();
    });
    window.addEventListener("beforeunload", save);
    const moreBtn = document.getElementById("moreBtn"), topbarEl = document.getElementById("topbar");
    if (moreBtn && topbarEl){
      moreBtn.addEventListener("click", function(){
        const open = topbarEl.classList.toggle("more-open");
        moreBtn.setAttribute("aria-expanded", open ? "true" : "false");
      });
    }
    ghInit();
    bindFind();
    document.addEventListener("visibilitychange", function(){
      if (document.hidden) ghAutoBackupNow();
    });

    let rzTimer = null;
    window.addEventListener("resize", function(){
      clearTimeout(rzTimer);
      rzTimer = setTimeout(function(){
        appEl.querySelectorAll(".tblwrap.editing").forEach(function(w){ buildHandles(w, w.dataset.table); });
        appEl.querySelectorAll(".wk-tblwrap.editing").forEach(function(w){ buildWeeklyHandles(w, w.dataset.wkTable); });
        positionToolbar();
      }, 120);
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
